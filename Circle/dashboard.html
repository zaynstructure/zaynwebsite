<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dashboard · CircleShare</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<!-- TOP RIGHT LOGOUT -->
<a href="#" id="logoutBtn" class="corner-auth">Logout</a>

<style>
.corner-auth {
  position:absolute;
  top:0.9rem;
  right:1rem;
  font-size:0.85rem;
  text-decoration:none;
  color:#333;
}
</style>

<script>
document.getElementById("logoutBtn").onclick = () => {
  localStorage.removeItem("logged_in");
  window.location.href = "index.html";
};
</script>

<main class="page" style="padding-top:4rem;">

  <h1 class="section-title" style="margin-bottom:1.4rem;">
    Welcome back
  </h1>

  <!-- MAIN ACTION BUTTONS -->
  <div style="display:flex; flex-direction:column; gap:1rem; max-width:350px; margin:0 auto 2rem;">
    <a class="btn btn-primary btn-large" href="library.html">Borrow / Lend</a>
    <a class="btn btn-primary btn-large" href="free.html">Give / Receive</a>
    <a class="btn btn-primary btn-large" href="circles.html">Circles</a>
  </div>

  <!-- RECENT ACTIVITY -->
  <h2 style="font-size:1rem; margin-bottom:0.6rem;">Your Activity</h2>

  <div class="card" id="activity-card" style="margin-bottom:2rem;">
    <p id="activity-empty" style="font-size:0.9rem; color:#777;">
      No recent activity yet.
    </p>
    <ul id="activity-list" style="display:none; padding-left:1rem; font-size:0.88rem;">
      <!-- Dynamic -->
    </ul>
  </div>

  <!-- POOL -->
  <div class="card" style="background:#f7f7f7;">
    <h3 style="margin:0 0 0.4rem;">Community Pool</h3>
    <p style="font-size:0.86rem; color:#555;">
      Optional contributions help cover repairs, replacements, and deposits.
    </p>
    <a class="btn btn-ghost" href="pool.html">Learn more</a>
  </div>

</main>

<!-- BOTTOM NAV (injected if logged in) -->
<div id="bottomNavContainer"></div>
<script src="bottom-nav.js"></script>

<script>
/* Load user activity */
document.addEventListener("DOMContentLoaded", () => {
  const list  = document.getElementById("activity-list");
  const empty = document.getElementById("activity-empty");

  const activity = JSON.parse(localStorage.getItem("user_activity") || "[]");

  if (activity.length === 0) return;

  empty.style.display = "none";
  list.style.display = "block";

  activity.slice(-5).reverse().forEach(msg => {
    const li = document.createElement("li");
    li.textContent = msg;
    list.appendChild(li);
  });
});
</script>

</body>
</html>
