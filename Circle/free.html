<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Free Items · CircleShare</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

<header>
  <div class="header-inner">
    <div class="logo">CircleShare</div>
    <a href="dashboard.html" style="text-decoration:none;">←</a>
  </div>
</header>

<main class="page">

  <h1 class="section-title">Free Items</h1>

  <p style="font-size:0.9rem; color:#555; margin-bottom:1.2rem;">
    No borrowing process, no requirements.<br>
    Share what you can, take what you need.
  </p>

  <a class="btn btn-primary" href="add_free.html" style="margin-bottom:1.4rem;">
    Add a Free Item
  </a>

  <!-- Container -->
  <div id="free-list"></div>

</main>

<footer>
  <div class="footer-nav">
    <a href="dashboard.html">Home</a>
    <a href="circles.html">Circles</a>
    <a href="library.html">Library</a>
    <a href="free.html">Free</a>
    <a href="pool.html">Pool</a>
    <a href="info.html">Info</a>
  </div>
</footer>

<script>
async function loadFreeItems() {
  const container = document.getElementById("free-list");
  const data = await fetch("free.json").then(r => r.json());

  Object.keys(data).forEach(id => {
    const item = data[id];

    const card = document.createElement("div");
    card.className = "card";
    card.style.marginBottom = "1.2rem";

    card.innerHTML = `
      <h3>${item.title}</h3>
      <p>${item.category} • ${item.location}</p>
      <p style="color:#777;">${item.condition}</p>

      <div style="
        background:url('${item.image}') center/cover no-repeat;
        width:100%; height:160px; border-radius:6px;
        margin:0.7rem 0 1rem;
      "></div>

      <p style="font-size:0.88rem; color:#555; margin-bottom:1rem;">
        ${item.notes}
      </p>

      <a class="btn btn-primary" href="#">Claim</a>
    `;

    container.appendChild(card);
  });
}

loadFreeItems();
</script>

</body>
</html>
