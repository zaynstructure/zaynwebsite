<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Free Items · CircleShare</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<!-- TOP RIGHT LOGIN / LOGOUT -->
<a href="#" id="authCorner" class="corner-auth"></a>

<style>
.corner-auth {
  position:absolute;
  top:0.9rem;
  right:1rem;
  font-size:0.85rem;
  text-decoration:none;
  color:#333;
}
</style>

<script>
const auth = document.getElementById("authCorner");

if (localStorage.getItem("logged_in") === "true") {
  auth.textContent = "Logout";
  auth.onclick = () => {
    localStorage.removeItem("logged_in");
    window.location.href = "index.html";
  };
} else {
  auth.textContent = "Login / Signup";
  auth.href = "login.html";
}
</script>

<main class="page" style="padding-top:4rem;">

  <h1 class="section-title">Free Food & Clothing</h1>

  <p style="font-size:0.9rem; color:#555; margin-bottom:1.5rem;">
    No borrowing steps — take what you need, or share what you can.
  </p>

  <!-- ADD FREE ITEM -->
  <a class="btn btn-primary" href="add_free.html" style="margin-bottom:1.4rem; display:inline-block;">
    + Add Free Item
  </a>

  <!-- FILTERS -->
  <div style="display:flex; gap:0.6rem; margin-bottom:1.4rem;">
    <select id="freeCategory" class="input">
      <option value="">All types</option>
      <option value="clothing">Clothing</option>
      <option value="food">Food</option>
    </select>

    <select id="freeArea" class="input">
      <option value="">Any area</option>
      <option>Quadra Village</option>
      <option>Fernwood</option>
      <option>Burnside</option>
      <option>Downtown</option>
    </select>
  </div>

  <!-- CONTAINER FOR FREE ITEMS -->
  <div id="free-list"></div>

</main>

<!-- BOTTOM NAV -->
<div id="bottomNavContainer"></div>
<script src="bottom-nav.js"></script>

<script>
async function loadFreeItems() {
  const container = document.getElementById("free-list");
  container.innerHTML = "";

  const categoryFilter = document.getElementById("freeCategory").value;
  const areaFilter     = document.getElementById("freeArea").value;

  const data = await fetch("free.json").then(r => r.json());

  Object.keys(data).forEach(id => {
    const item = data[id];

    // FILTER: category
    if (categoryFilter && item.type !== categoryFilter) return;

    // FILTER: area
    if (areaFilter && item.location !== areaFilter) return;

    // CARD
    const card = document.createElement("div");
    card.className = "card";
    card.style.marginBottom = "1.2rem";

    card.innerHTML = `
      <h3>${item.title}</h3>
      <p>${item.category} • ${item.location}</p>
      <p style="color:#777;">${item.condition}</p>

      <div style="
        background:url('${item.image}') center/cover no-repeat;
        width:100%; height:160px;
        border-radius:6px;
        margin:0.7rem 0 1rem;
      "></div>

      <p style="font-size:0.88rem; color:#555; margin-bottom:1rem;">
        ${item.notes}
      </p>

      <a class="btn btn-primary" href="free_item.html?id=${id}">View</a>
    `;

    container.appendChild(card);
  });
}

// Reload on filter change
document.getElementById("freeCategory").addEventListener("change", loadFreeItems);
document.getElementById("freeArea").addEventListener("change", loadFreeItems);

// Initial load
loadFreeItems();
</script>

</body>
</html>
