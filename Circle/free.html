<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Free Items · CircleShare</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

<header>
  <div class="header-inner">
    <div class="logo">CircleShare</div>
    <a href="dashboard.html" style="text-decoration:none;">←</a>
  </div>
</header>

<main class="page">

  <h1 class="section-title">Free Items</h1>

  <p style="font-size:0.9rem; color:#555; margin-bottom:1rem;">
    Share what you can, take what you need.  
    No borrowing steps.
  </p>

  <a class="btn btn-primary" href="add_free.html" style="margin-bottom:1rem;">
    Add Free Item
  </a>

  <!-- FILTER -->
  <div class="card" style="padding:0.8rem; margin-bottom:1rem;">
    <label style="font-size:0.9rem; color:#555;">
      Filter by category:
    </label>
    <select id="filter-select" class="input" style="margin-top:0.4rem;">
      <option value="all">All</option>
      <option value="Clothing">Clothing</option>
      <option value="Food">Food</option>
      <option value="Books">Books</option>
      <option value="Household">Household</option>
      <option value="Toys">Toys</option>
      <option value="Other">Other</option>
    </select>
  </div>

  <!-- Container -->
  <div id="free-list"></div>

</main>

<footer>
  <div class="footer-nav">
    <a href="dashboard.html">Home</a>
    <a href="circles.html">Circles</a>
    <a href="library.html">Library</a>
    <a href="free.html">Free</a>
    <a href="pool.html">Pool</a>
    <a href="info.html">Info</a>
  </div>
</footer>

<script>
let freeData = {};

async function loadFreeItems() {
  const container = document.getElementById("free-list");

  freeData = await fetch("free.json").then(r => r.json());
  renderItems("all");
}

function renderItems(category) {
  const container = document.getElementById("free-list");
  container.innerHTML = "";

  Object.keys(freeData).forEach(id => {
    const item = freeData[id];

    if (category !== "all" && item.category !== category) return;

    const card = document.createElement("div");
    card.className = "card";
    card.style.marginBottom = "1.2rem";

    card.innerHTML = `
      <h3>${item.title}</h3>
      <p>${item.category} • ${item.location}</p>
      <p style="color:#777;">${item.condition}</p>

      <div style="
        background:url('${item.image}') center/cover no-repeat;
        width:100%; height:160px; border-radius:6px;
        margin:0.7rem 0 1rem;
      "></div>

      <p style="font-size:0.88rem; color:#555; margin-bottom:1rem;">
        ${item.notes}
      </p>

      <a class="btn btn-secondary" href="free_item.html?id=${id}">
        View
      </a>
    `;

    container.appendChild(card);
  });
}

document.getElementById("filter-select").addEventListener("change", (e) => {
  renderItems(e.target.value);
});

loadFreeItems();
</script>

</body>
</html>
