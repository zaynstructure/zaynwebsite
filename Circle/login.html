<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Log In · CircleShare</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<header>
  <div class="header-inner">
    <div class="logo">CircleShare</div>
    <a href="index.html">←</a>
  </div>
</header>

<main class="page">

  <h1 class="section-title">Log In</h1>

  <p style="font-size:0.9rem; color:#555; margin-bottom:1.4rem;">
    Log back into your CircleShare account.
  </p>

  <div class="card" style="padding:1rem;">
    <label class="form-label">Name</label>
    <input id="login-name" class="input" type="text" placeholder="Your name">

    <button id="login-btn" class="btn btn-primary" style="margin-top:1rem;">
      Log In
    </button>
  </div>

</main>

<script>
document.getElementById('login-btn').addEventListener('click', () => {
  const name = document.getElementById('login-name').value.trim();
  if (!name) return alert("Enter your name.");

  const storedName = localStorage.getItem('user_name');

  if (storedName && name === storedName) {
    localStorage.setItem('user_logged_in', 'true');
    window.location.href = "profile.html";
  } else {
    alert("No account found with that name.");
  }
});
</script>

</body>
</html>
