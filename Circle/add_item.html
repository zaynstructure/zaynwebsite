<div class="card" style="padding:1rem; margin-top:1rem;">
  <h3 style="margin:0 0 .6rem;">Lending Requirements</h3>

  <label style="display:block; margin-bottom:.4rem;">
    <input type="radio" name="req" value="open" checked />
    Open to all members
  </label>

  <label style="display:block; margin-bottom:.4rem;">
    <input type="radio" name="req" value="participating" />
    Participating members only
  </label>

  <label style="display:block; margin-bottom:.4rem;">
    <input type="radio" name="req" value="trusted" />
    Trusted borrowers only
  </label>

  <p style="font-size:.8rem; color:#777; margin-top:.4rem;">
    Requirements are based on community participation  
    (returns, circles, shared items, pool contributions).  
    This ensures fair access while protecting lenders.
  </p>
</div>
