<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Free Item · CircleShare</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

<!-- HEADER -->
<header class="top-header">
  <div class="header-inner">
    <div class="logo">CircleShare</div>

    <div class="header-right">
      <a href="dashboard.html" class="small-arrow">→</a>
      <a id="logoutBtn" class="logout-link">Logout</a>
    </div>
  </div>
</header>

<style>
.top-header {
  background:#fff;
  border-bottom:1px solid #ddd;
}
.header-inner {
  max-width:600px;
  margin:0 auto;
  padding:0.8rem 1rem;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.small-arrow, .logout-link {
  font-size:0.85rem;
  color:#333;
  text-decoration:none;
  margin-left:0.6rem;
}
.small-arrow:hover, .logout-link:hover {
  text-decoration:underline;
}
.header-right {
  display:flex;
  align-items:center;
}
</style>

<script>
document.getElementById("logoutBtn")?.addEventListener("click", () => {
  localStorage.removeItem("logged_in");
  window.location.href = "index.html";
});
</script>

<main class="page" style="padding-top:1rem;">

  <a href="free.html" style="text-decoration:none; font-size:0.9rem;">← Back to Free Section</a>

  <h1 id="item-title" class="section-title" style="margin-top:0.6rem;"></h1>

  <p id="item-sub" style="color:#666; margin-bottom:1rem;"></p>

  <div id="item-image" 
       style="background:#eee; height:220px; border-radius:8px; margin-bottom:1rem;">
  </div>

  <div class="card">
    <p><strong>Category:</strong> <span id="item-category"></span></p>
    <p><strong>Area:</strong> <span id="item-location"></span></p>
    <p><strong>Condition:</strong> <span id="item-condition"></span></p>
  </div>

  <h2 style="font-size:1.05rem; margin:1.4rem 0 0.4rem;">Notes</h2>
  <p id="item-notes" style="font-size:0.88rem; color:#444;"></p>

  <a id="claimBtn" class="btn btn-primary" style="margin-top:1.6rem;">
  Claim this item
</a>
</main>

<!-- FOOTER NAV -->
<footer>
  <div class="footer-nav">
    <a href="dashboard.html">Home</a>
    <a href="circles.html">Circles</a>
    <a href="library.html">Borrow/Lend</a>
    <a href="free.html">Give/Receive</a>
    <a href="info.html">Info</a>
  </div>
</footer>

<script>
/* LOAD FREE ITEM DETAILS */
async function loadFreeItem() {
  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");
  if (!id) return;

  const data = await fetch("free.json").then(r => r.json());
  const item = data[id];
  if (!item) return;

  document.getElementById("item-title").innerText = item.title;
  document.getElementById("item-sub").innerText =
    `${item.category} • ${item.location}`;
  document.getElementById("item-category").innerText = item.category;
  document.getElementById("item-location").innerText = item.location;
  document.getElementById("item-condition").innerText = item.condition;
  document.getElementById("item-notes").innerText = item.notes;

  document.getElementById("item-image").style.backgroundImage =
    `url(${item.image})`;
  document.getElementById("item-image").style.backgroundSize = "cover";
  document.getElementById("item-image").style.backgroundPosition = "center";

  document.getElementById("claimBtn").href = `claim_free.html?id=${id}`;
}

loadFreeItem();
</script>

</body>
</html>
