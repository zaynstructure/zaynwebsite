<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Borrow · CircleShare</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

<header>
  <div class="header-inner">
    <div class="logo">CircleShare</div>
    <a href="item.html?id=1" style="text-decoration:none;">←</a>
  </div>
</header>

<main class="page">

  <h1 class="section-title">Borrow Request</h1>

  <div class="card" style="margin-bottom:1rem;">
    <p><strong id="itemName">Item Name</strong></p>
    <p id="itemLocation" style="color:#777;"></p>
  </div>

  <h3 style="margin:1.2rem 0 0.4rem;">Pick-up Window</h3>
  <input type="date" id="borrowDate" style="margin-bottom:1rem;">

  <h3 style="margin:1rem 0 0.4rem;">Return Date</h3>
  <input type="date" id="returnDate" style="margin-bottom:1rem;">

  <h3 style="margin:1.2rem 0 0.4rem;">First 3 Borrows</h3>
  <p style="font-size:0.82rem; color:#666;">
    Choose one quick accountability step:
  </p>

  <div class="card" style="margin-bottom:1rem;" id="firstSteps">
    <label style="display:block; margin-bottom:0.4rem;">
      <input type="radio" name="acct" value="deposit"> $5 refundable deposit
    </label>
    <label style="display:block; margin-bottom:0.4rem;">
      <input type="radio" name="acct" value="backup"> Add backup contact
    </label>
    <label style="display:block;">
      <input type="radio" name="acct" value="care"> Read care basics
    </label>
  </div>

  <div id="poolAssist" class="card" style="display:none; background:#f7f7f7;">
    <p style="font-size:0.85rem; margin:0;">
      Not able to cover a deposit?  
      <strong>The community pool can help.</strong>
    </p>
  </div>

  <a class="btn btn-primary" id="continueBtn" style="margin-top:1.4rem;">
    Continue
  </a>

</main>

<footer>
  <div class="footer-nav">
    <a href="dashboard.html">Home</a>
    <a href="circles.html">Circles</a>
    <a href="library.html">Borrow/Lend</a>
    <a href="free.html">Give/Receive</a>
    <a href="info.html">Info</a>
  </div>
</footer>

<script>
document.getElementById("continueBtn").addEventListener("click", () => {
  const acct = document.querySelector('input[name="acct"]:checked');
  if (!acct) { alert("Please choose an accountability step."); return; }

  localStorage.setItem("borrow_acct", acct.value);
  window.location.href = "borrow_confirm.html";
});

// If choosing deposit shows pool assist option
document.getElementById("firstSteps").addEventListener("change", () => {
  const acct = document.querySelector('input[name="acct"]:checked');
  document.getElementById("poolAssist").style.display = 
    (acct && acct.value === "deposit") ? "block" : "none";
});
</script>

</body>
</html>
