  <style>
    /* Calendar styling (inline so page is self-contained) */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      margin-top: 0.5rem;
    }

    .calendar-day {
      padding: 0.6rem 0;
      background: #f1f1f1;
      border-radius: 6px;
      text-align: center;
      font-size: 0.8rem;
      color: #333;
      cursor: pointer;
      user-select: none;
    }

    .calendar-day.unavailable {
      background: #ddd;
      color: #777;
      cursor: not-allowed;
    }

    .calendar-day.selected {
      background: #111;
      color: white;
    }
  </style>
</head>
