<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sign Up · CircleShare</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

<header>
  <div class="header-inner">
    <div class="logo">CircleShare</div>
    <a href="index.html" style="font-size:1.2rem; text-decoration:none;">←</a>
  </div>
</header>

<main class="page" style="padding-top:2.2rem;">

  <h1 style="text-align:center; margin-bottom:0.5rem;">
    Create your account
  </h1>

  <p style="text-align:center; font-size:0.9rem; color:#5c5c5c; margin-bottom:1.6rem;">
    Borrow, lend, and join circles in your community.
  </p>

  <form style="max-width:22rem; margin:0 auto; display:flex; flex-direction:column; gap:1rem;">

    <input 
      type="email" 
      placeholder="Email" 
      required
      class="input"
      style="padding:0.9rem; border:1px solid #ddd; border-radius:6px;"
    />

    <input 
      type="text" 
      placeholder="Name (optional)" 
      class="input"
      style="padding:0.9rem; border:1px solid #ddd; border-radius:6px;"
    />

    <input 
      type="password" 
      placeholder="Password" 
      required
      class="input"
      style="padding:0.9rem; border:1px solid #ddd; border-radius:6px;"
    />

    <!-- Tone-setting checkbox, not surveillance -->
    <label style="font-size:0.85rem; color:#555; line-height:1.4; display:flex; gap:0.5rem; align-items:flex-start;">
      <input type="checkbox" required style="margin-top:0.2rem;">
      I agree to borrow responsibly and return items with care.
    </label>

    <button class="btn btn-primary" type="submit">Sign up</button>

  </form>

  <p style="text-align:center; margin-top:1.4rem; font-size:0.85rem;">
    Already have an account? <a href="login.html" style="color:#1a1a1a;">Log in</a>
  </p>

</main>

</body>
</html>
