<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign Up · CircleShare</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<header>
  <div class="header-inner">
    <div class="logo">CircleShare</div>
    <a href="index.html">←</a>
  </div>
</header>

<main class="page">

  <h1 class="section-title">Create an Account</h1>

  <p style="font-size:0.9rem; color:#555; margin-bottom:1.4rem;">
    No email required — just choose a display name to get started.
  </p>

  <div class="card" style="padding:1rem;">
    <label class="form-label">Name</label>
    <input id="signup-name" class="input" type="text" placeholder="e.g. Alex" required>

    <button id="signup-btn" class="btn btn-primary" style="margin-top:1rem;">
      Create Account
    </button>
  </div>

</main>

<script>
document.getElementById('signup-btn').addEventListener('click', () => {
  const name = document.getElementById('signup-name').value.trim();
  if (!name) return alert("Enter a name.");

  // Save user data
  localStorage.setItem('user_name', name);
  localStorage.setItem('user_logged_in', 'true');

  // Redirect to profile
  window.location.href = "profile.html";
});
</script>

</body>
</html>
