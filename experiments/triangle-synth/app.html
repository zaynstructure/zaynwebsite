<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>triangle synth · zayn wiwchar</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<style>
  /* plain lab-instrument look: paper, 1px ink boxes, dashed guides,
     red/blue data, with stippled fills where a gradient would normally go */
  :root {
    --paper: #fbfbf8;
    --ink: #141414;
    --muted: #6f6e69;
    --faint: #b9b8b2;
    --red: #b3342a;
    --blue: #2433a3;
    --stipple: 3px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background-color: var(--paper);
    background-image: radial-gradient(rgba(20,20,20,.07) .6px, transparent .9px);
    background-size: 7px 7px;
    color: var(--ink);
    font: 15px/1.4 "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 20px 20px 36px; }

  /* top line */
  .top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 10px 16px; padding-bottom: 10px; border-bottom: 1px solid var(--ink); }
  .top h1 { margin: 0; font-size: 1.05rem; font-weight: 500; letter-spacing: .01em; }
  .top h1 .dim { color: var(--muted); font-weight: 400; }
  .transport { display: flex; align-items: center; gap: 8px; }
  .status { font-size: .85rem; color: var(--muted); min-width: 5.5em; }
  .status::before { content: "○ "; }
  .status.on { color: var(--red); }
  .status.on::before { content: "● "; }
  .headline { margin: 10px 0 16px; font-size: .95rem; font-variant-numeric: tabular-nums; }
  .headline b { font-weight: 500; }

  /* plots */
  .plots { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
  figure { margin: 0; min-width: 0; }
  figcaption { margin-bottom: 6px; font-size: .95rem; }
  figcaption .k1 { color: var(--red); }
  figcaption .k2 { color: var(--blue); }
  .box { position: relative; aspect-ratio: 1 / 1; border: 1px solid var(--ink); background: var(--paper); }
  canvas { width: 100%; height: 100%; display: block; }
  #triCanvas { touch-action: none; cursor: crosshair; }

  /* stippled meters */
  .meters { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; margin-top: 16px; }
  .meter-name { font-size: .95rem; font-variant-numeric: tabular-nums; }
  .bar { margin-top: 6px; height: 12px; border: 1px solid var(--ink); background: var(--paper); }
  .fill {
    height: 100%; width: 0%;
    background-image: radial-gradient(currentColor .95px, transparent 1.25px);
    background-size: var(--stipple) var(--stipple);
  }
  .contain { color: var(--red); }
  .diffuse { color: var(--blue); }
  .direct { color: var(--ink); }

  .quick { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 18px; }
  .quick .lab { margin-right: 6px; font-size: .95rem; }

  /* controls */
  .sections { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 40px; margin-top: 24px; }
  section { padding-top: 14px; border-top: 1px dashed var(--faint); margin-bottom: 8px; }
  section h2 { margin: 0 0 10px; font-size: .78rem; font-weight: 500; color: var(--muted); text-transform: lowercase; letter-spacing: .06em; }
  .ctl { display: block; margin-bottom: 14px; }
  .ctl .name { display: block; margin-bottom: 4px; font-size: .95rem; font-variant-numeric: tabular-nums; }
  .ctl .value { margin-left: .25em; }

  input[type="range"] {
    --p: 50%;
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 18px; margin: 0; background: transparent; cursor: pointer;
  }
  input[type="range"]::-webkit-slider-runnable-track {
    height: 8px;
    background:
      linear-gradient(to right, var(--red) 0 var(--p), transparent var(--p)),
      radial-gradient(var(--ink) .95px, transparent 1.25px) 0 0 / var(--stipple) var(--stipple);
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 16px; height: 16px; margin-top: -4px;
    border-radius: 50%; border: 1.5px solid var(--ink); background: var(--red);
  }
  input[type="range"]::-moz-range-track {
    height: 8px;
    background: radial-gradient(var(--ink) .95px, transparent 1.25px) 0 0 / var(--stipple) var(--stipple);
  }
  input[type="range"]::-moz-range-progress { height: 8px; background: var(--red); }
  input[type="range"]::-moz-range-thumb {
    width: 13px; height: 13px; border-radius: 50%; border: 1.5px solid var(--ink); background: var(--red);
  }
  input[type="range"]:focus-visible { outline: 1px dashed var(--ink); outline-offset: 3px; }

  select {
    width: 100%; padding: 4px 6px; font: inherit; color: var(--ink);
    background: var(--paper); border: 1px solid var(--ink); border-radius: 0;
  }
  button {
    font: inherit; font-size: .92rem; color: var(--ink);
    background: #ecebe6; border: 1px solid var(--ink); border-radius: 0;
    padding: 3px 10px; cursor: pointer;
  }
  button:hover { background: var(--ink); color: var(--paper); }
  button:focus-visible { outline: 1px dashed var(--ink); outline-offset: 2px; }

  /* readout */
  .readout-wrap { margin-top: 8px; padding-top: 14px; border-top: 1px dashed var(--faint); }
  .readout { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 3px 16px; margin: 0; padding: 12px 14px; border: 1px solid var(--ink); background: var(--paper); font-size: .92rem; }
  .readout dt { color: var(--muted); }
  .readout dd { margin: 0; font-variant-numeric: tabular-nums; }
  .footer { margin-top: 10px; color: var(--muted); font-size: .84rem; }

  @media (max-width: 720px) {
    .plots, .sections { grid-template-columns: minmax(0, 1fr); }
    .meters { gap: 12px; }
    .wrap { padding: 16px 16px 28px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>triangle synth <span class="dim">· two voices, one scale</span></h1>
    <div class="transport">
      <button id="startAudio">start audio</button>
      <button id="stopAudio">stop</button>
      <span class="status" id="audioStatus">idle</span>
    </div>
  </header>

  <div class="headline" id="headline"></div>

  <div class="plots">
    <figure>
      <figcaption>Triangle pad. Drag the point; lines show its distance to each side.</figcaption>
      <div class="box"><canvas id="triCanvas" width="720" height="720"></canvas></div>
    </figure>
    <figure>
      <figcaption>Note log (<span class="k1">source 1</span>, <span class="k2">source 2</span>). Height is pitch.</figcaption>
      <div class="box"><canvas id="logCanvas" width="720" height="720"></canvas></div>
    </figure>
  </div>

  <div class="meters">
    <div><div class="meter-name">containment <span id="cVal">0.33</span></div><div class="bar"><div class="fill contain" id="cFill"></div></div></div>
    <div><div class="meter-name">diffusion <span id="dVal">0.33</span></div><div class="bar"><div class="fill diffuse" id="dFill"></div></div></div>
    <div><div class="meter-name">direction <span id="rVal">0.34</span></div><div class="bar"><div class="fill direct" id="rFill"></div></div></div>
  </div>

  <div class="quick">
    <span class="lab">positions</span>
    <button data-preset="center">center</button>
    <button data-preset="containment">containment</button>
    <button data-preset="diffusion">diffusion</button>
    <button data-preset="direction">direction</button>
    <button data-preset="cdEdge">contain + diffuse</button>
    <button data-preset="drEdge">diffuse + direct</button>
    <button data-preset="rcEdge">direct + contain</button>
  </div>

  <div class="sections">
    <div>
      <section>
        <h2>sources</h2>
        <label class="ctl"><span class="name">Source 1 wave</span>
          <select id="oscType"><option>sine</option><option selected>triangle</option><option>sawtooth</option><option>square</option></select></label>
        <label class="ctl"><span class="name">Source 1 root <span class="value" id="freqValue">220 Hz</span></span>
          <input id="baseFreq" type="range" min="110" max="330" step="1" value="220" /></label>
        <label class="ctl"><span class="name">Source 2 wave</span>
          <select id="oscType2"><option selected>sine</option><option>triangle</option><option>sawtooth</option><option>square</option></select></label>
        <label class="ctl"><span class="name">Source 2 root <span class="value" id="freq2Value">220 Hz</span></span>
          <input id="baseFreq2" type="range" min="110" max="330" step="1" value="220" /></label>
        <label class="ctl"><span class="name">Source 2 mix <span class="value" id="src2MixValue">0.24</span></span>
          <input id="src2Mix" type="range" min="0" max="0.8" step="0.01" value="0.24" /></label>
        <label class="ctl"><span class="name">Scale</span>
          <select id="scaleMode">
            <option value="aminor_sparse" selected>A minor sparse</option>
            <option value="aminor_full">A minor fuller</option>
            <option value="aminor_penta">A minor pentatonic</option>
            <option value="aharmonic">A harmonic minor</option>
            <option value="adorian">A dorian</option>
            <option value="aphrygian">A phrygian</option>
          </select></label>
        <label class="ctl"><span class="name">Source 2 mapping</span>
          <select id="invertMode">
            <option value="mirror" selected>mirror inversion</option>
            <option value="same">same note set</option>
            <option value="fifth">fifth above</option>
            <option value="octave_down">octave down mirror</option>
          </select></label>
        <label class="ctl"><span class="name">Master <span class="value" id="masterValue">0.24</span></span>
          <input id="master" type="range" min="0" max="0.5" step="0.01" value="0.24" /></label>
      </section>
    </div>

    <div>
      <section>
        <h2>external cycle</h2>
        <label class="ctl"><span class="name">Pulse rate <span class="value" id="rateValue">1.40 Hz</span></span>
          <input id="pulseRate" type="range" min="0.2" max="6" step="0.01" value="1.4" /></label>
        <label class="ctl"><span class="name">Irregularity <span class="value" id="irregValue">0.12</span></span>
          <input id="irregularity" type="range" min="0" max="1" step="0.01" value="0.12" /></label>
      </section>
      <section>
        <h2>internal cycle (adsr)</h2>
        <label class="ctl"><span class="name">Attack <span class="value" id="attackValue">0.06 s</span></span>
          <input id="attack" type="range" min="0.005" max="1.5" step="0.005" value="0.06" /></label>
        <label class="ctl"><span class="name">Decay <span class="value" id="decayValue">0.18 s</span></span>
          <input id="decay" type="range" min="0.01" max="2" step="0.01" value="0.18" /></label>
        <label class="ctl"><span class="name">Sustain <span class="value" id="sustainValue">0.32</span></span>
          <input id="sustain" type="range" min="0" max="1" step="0.01" value="0.32" /></label>
        <label class="ctl"><span class="name">Release <span class="value" id="releaseValue">0.50 s</span></span>
          <input id="release" type="range" min="0.02" max="3" step="0.01" value="0.50" /></label>
        <label class="ctl"><span class="name">Overlap <span class="value" id="overlapValue">0.18</span></span>
          <input id="overlap" type="range" min="0" max="1" step="0.01" value="0.18" /></label>
      </section>
      <section>
        <h2>global</h2>
        <label class="ctl"><span class="name">Activation <span class="value" id="actValue">0.62</span></span>
          <input id="activation" type="range" min="0" max="1" step="0.01" value="0.62" /></label>
        <label class="ctl"><span class="name">Timing / resonance <span class="value" id="timeValue">0.48</span></span>
          <input id="timing" type="range" min="0" max="1" step="0.01" value="0.48" /></label>
        <label class="ctl"><span class="name">Dry / wet <span class="value" id="wetValue">0.48</span></span>
          <input id="drywet" type="range" min="0" max="1" step="0.01" value="0.48" /></label>
      </section>
    </div>
  </div>

  <div class="readout-wrap">
    <dl class="readout" id="readout"></dl>
    <div class="footer">Default volume is deliberately low. If nothing plays after a reload, press start audio again.</div>
  </div>
</div>

<script>
(() => {
  const el = id => document.getElementById(id);
  const canvas = el('triCanvas');
  const ctx = canvas.getContext('2d');
  const controls = {
    oscType: el('oscType'), oscType2: el('oscType2'), baseFreq: el('baseFreq'), baseFreq2: el('baseFreq2'),
    pulseRate: el('pulseRate'), irregularity: el('irregularity'), attack: el('attack'), decay: el('decay'),
    sustain: el('sustain'), release: el('release'), overlap: el('overlap'), activation: el('activation'),
    timing: el('timing'), drywet: el('drywet'), src2Mix: el('src2Mix'), scaleMode: el('scaleMode'), invertMode: el('invertMode'), master: el('master')
  };
  const values = {
    freqValue: el('freqValue'), freq2Value: el('freq2Value'), rateValue: el('rateValue'), irregValue: el('irregValue'),
    attackValue: el('attackValue'), decayValue: el('decayValue'), sustainValue: el('sustainValue'), releaseValue: el('releaseValue'),
    overlapValue: el('overlapValue'), actValue: el('actValue'), timeValue: el('timeValue'), wetValue: el('wetValue'), src2MixValue: el('src2MixValue'), masterValue: el('masterValue'),
    audioStatus: el('audioStatus'), readout: el('readout'), cVal: el('cVal'), dVal: el('dVal'), rVal: el('rVal'),
    cFill: el('cFill'), dFill: el('dFill'), rFill: el('rFill'), headline: el('headline')
  };
  const logCanvas = el('logCanvas');
  const lctx = logCanvas.getContext('2d');
  const INK = '#141414', MUTED = '#6f6e69', FAINT = '#b9b8b2', RED = '#b3342a', BLUE = '#2433a3', PAPER = '#fbfbf8';
  const FONT = '"Helvetica Neue", Helvetica, Arial, sans-serif';

  const pad = 60;
  const Vd = { x: canvas.width / 2, y: pad + 10 };
  const Vc = { x: pad + 24, y: canvas.height - pad };
  const Vdiff = { x: canvas.width - pad - 24, y: canvas.height - pad };
  let point = baryToPoint(0.33, 0.33, 0.34), dragging = false;

  // fixed stipple field inside the triangle: each dot carries its own
  // threshold, so density can rise around the handle without the dots jumping
  const stipple = (() => {
    let seed = 0x9e3779b9;
    const rand = () => { seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    const dots = [];
    for (let i = 0; i < 14000; i++) {
      let a = rand(), b = rand();
      if (a + b > 1) { a = 1 - a; b = 1 - b; }
      const p = baryToPoint(a, b, 1 - a - b);
      dots.push({ x: p.x, y: p.y, u: rand() });
    }
    return dots;
  })();

  let audioCtx = null, masterGain = null, dryGain = null, wetGain = null, delayNode = null, feedbackGain = null, hpWet = null;
  let schedulerId = null, nextPulseTime = 0, pulseIndex = 0;

  function baryToPoint(C,D,R){ return { x: C*Vc.x + D*Vdiff.x + R*Vd.x, y: C*Vc.y + D*Vdiff.y + R*Vd.y }; }
  function pointToBary(p) {
    const det = (Vdiff.y - Vd.y) * (Vc.x - Vd.x) + (Vd.x - Vdiff.x) * (Vc.y - Vd.y);
    let C = ((Vdiff.y - Vd.y) * (p.x - Vd.x) + (Vd.x - Vdiff.x) * (p.y - Vd.y)) / det;
    let D = ((Vd.y - Vc.y) * (p.x - Vd.x) + (Vc.x - Vd.x) * (p.y - Vd.y)) / det;
    let R = 1 - C - D;
    return { C, D, R };
  }
  function clampToTriangle(p) {
    let { C, D, R } = pointToBary(p);
    C = Math.max(0, C); D = Math.max(0, D); R = Math.max(0, R);
    const sum = C + D + R || 1;
    return baryToPoint(C / sum, D / sum, R / sum);
  }
  const fmt = (v, d=2) => Number(v).toFixed(d);
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const lerp = (a,b,t) => a + (b-a)*t;

  function regionName(C,D,R) {
    const vals = [{k:'containment',v:C},{k:'diffusion',v:D},{k:'direction',v:R}].sort((a,b)=>b.v-a.v);
    if (Math.abs(C-D) < .08 && Math.abs(D-R) < .08) return 'Balanced center';
    if (vals[0].v > .68) return vals[0].k + ' dominant';
    return vals[0].k + ' + ' + vals[1].k;
  }
  function phaseFeel(t) {
    if (t < .25) return 'drifting / loose relation';
    if (t < .5) return 'partially coupled / unstable relation';
    if (t < .75) return 'coordinated / moderate reinforcement';
    return 'phase-locked / strong reinforcement';
  }
  function getState() {
    const { C, D, R } = pointToBary(point);
    return {
      C,D,R,
      F: parseFloat(controls.baseFreq.value), F2: parseFloat(controls.baseFreq2.value),
      rate: parseFloat(controls.pulseRate.value), irr: parseFloat(controls.irregularity.value),
      attack: parseFloat(controls.attack.value), decay: parseFloat(controls.decay.value),
      sustain: parseFloat(controls.sustain.value), release: parseFloat(controls.release.value), overlap: parseFloat(controls.overlap.value),
      A: parseFloat(controls.activation.value), T: parseFloat(controls.timing.value), W: parseFloat(controls.drywet.value), src2Mix: parseFloat(controls.src2Mix.value), master: parseFloat(controls.master.value),
      oscType: controls.oscType.value, oscType2: controls.oscType2.value, scaleMode: controls.scaleMode.value, invertMode: controls.invertMode.value
    };
  }
  function updateLabels() {
    const s = getState();
    values.freqValue.textContent = `${Math.round(s.F)} Hz`;
    values.freq2Value.textContent = `${Math.round(s.F2)} Hz`;
    values.rateValue.textContent = `${fmt(s.rate)} Hz`;
    values.irregValue.textContent = fmt(s.irr);
    values.attackValue.textContent = `${fmt(s.attack)} s`;
    values.decayValue.textContent = `${fmt(s.decay)} s`;
    values.sustainValue.textContent = fmt(s.sustain);
    values.releaseValue.textContent = `${fmt(s.release)} s`;
    values.overlapValue.textContent = fmt(s.overlap);
    values.actValue.textContent = fmt(s.A);
    values.timeValue.textContent = fmt(s.T);
    values.wetValue.textContent = fmt(s.W);
    values.src2MixValue.textContent = fmt(s.src2Mix);
    values.masterValue.textContent = fmt(s.master);
    values.cVal.textContent = fmt(s.C); values.dVal.textContent = fmt(s.D); values.rVal.textContent = fmt(s.R);
    values.cFill.style.width = `${s.C*100}%`; values.dFill.style.width = `${s.D*100}%`; values.rFill.style.width = `${s.R*100}%`;
    document.querySelectorAll('input[type="range"]').forEach(r => {
      const p = (r.value - r.min) / (r.max - r.min) * 100;
      r.style.setProperty('--p', `${p}%`);
    });
  }
  function characterText(s) {
    if (s.C > s.D && s.C > s.R) return 'Held, damped, more restrained.';
    if (s.D > s.C && s.D > s.R) return 'Spread, softened, widened.';
    if (s.R > s.C && s.R > s.D) return 'Biased, pushing, leaning forward.';
    if (s.C > .3 && s.D > .3 && s.R < .2) return 'Held spaciousness.';
    if (s.D > .3 && s.R > .3 && s.C < .2) return 'Moving atmosphere.';
    if (s.R > .3 && s.C > .3 && s.D < .2) return 'Focused pressure.';
    return 'Balanced, live, moderate regulation.';
  }
  function updateReadout() {
    const s = getState();
    updateLabels();
    const region = regionName(s.C,s.D,s.R).toLowerCase();
    values.headline.innerHTML = `${Math.round(s.F)} + ${Math.round(s.F2)} Hz · ${controls.scaleMode.options[controls.scaleMode.selectedIndex].text} · <b>${region}</b> · ${characterText(s).toLowerCase()}`;
    values.readout.innerHTML = `<dt>region</dt><dd>${region}</dd>
      <dt>character</dt><dd>${characterText(s)}</dd>
      <dt>external cycle</dt><dd>${fmt(s.rate)} Hz pulse rate, irregularity ${fmt(s.irr)}</dd>
      <dt>internal cycle</dt><dd>A ${fmt(s.attack)} / D ${fmt(s.decay)} / S ${fmt(s.sustain)} / R ${fmt(s.release)} / overlap ${fmt(s.overlap)}</dd>
      <dt>timing</dt><dd>${fmt(s.T)} — ${phaseFeel(s.T)}</dd>
      <dt>pitch</dt><dd>source 1 picks from the scale over ~1 octave; source 2 follows by the mapping below.</dd>
      <dt>source 2</dt><dd>${controls.invertMode.options[controls.invertMode.selectedIndex].text}, mix ${fmt(s.src2Mix)}</dd>
      <dt>mapping</dt><dd>containment → darker/shorter, diffusion → wider/wetter, direction → more pan/filter motion</dd>`;
    draw();
    if (!schedulerId) drawLog();
    updateGlobals();
  }

  function draw() {
    const W = canvas.width, H = canvas.height;
    ctx.fillStyle = PAPER; ctx.fillRect(0,0,W,H);

    // stipple: a sparse even field, thickening around the handle
    const sigma2 = 2 * 95 * 95;
    ctx.fillStyle = INK;
    for (const d of stipple) {
      const dx = d.x - point.x, dy = d.y - point.y;
      if (d.u < .05 + .8 * Math.exp(-(dx*dx + dy*dy) / sigma2)) ctx.fillRect(d.x - 1.1, d.y - 1.1, 2.2, 2.2);
    }

    // dashed medians
    ctx.setLineDash([6, 6]); ctx.strokeStyle = FAINT; ctx.lineWidth = 1.5;
    [[Vd, midpoint(Vc,Vdiff)],[Vc, midpoint(Vd,Vdiff)],[Vdiff, midpoint(Vd,Vc)]].forEach(([a,b]) => { ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); });
    ctx.setLineDash([]);

    ctx.beginPath(); ctx.moveTo(Vd.x,Vd.y); ctx.lineTo(Vc.x,Vc.y); ctx.lineTo(Vdiff.x,Vdiff.y); ctx.closePath();
    ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.stroke();

    // distance from the handle to each side = that corner's weight
    ctx.strokeStyle = BLUE; ctx.lineWidth = 1.5;
    [[Vc,Vdiff],[Vdiff,Vd],[Vd,Vc]].forEach(([a,b]) => {
      const f = foot(point, a, b);
      ctx.beginPath(); ctx.moveTo(point.x, point.y); ctx.lineTo(f.x, f.y); ctx.stroke();
      ctx.fillStyle = BLUE; ctx.fillRect(f.x - 2.5, f.y - 2.5, 5, 5);
    });
    ctx.beginPath(); ctx.arc(point.x, point.y, 7, 0, Math.PI*2); ctx.fillStyle = BLUE; ctx.fill();

    const { C, D, R } = pointToBary(point);
    ctx.font = `24px ${FONT}`; ctx.textAlign = 'center';
    ctx.fillStyle = INK; ctx.fillText(`direction ${fmt(R)}`, Vd.x, Vd.y - 20);
    ctx.fillStyle = RED; ctx.textAlign = 'left'; ctx.fillText(`containment ${fmt(C)}`, Vc.x - 40, Vc.y + 36);
    ctx.fillStyle = BLUE; ctx.textAlign = 'right'; ctx.fillText(`diffusion ${fmt(D)}`, Vdiff.x + 40, Vdiff.y + 36);
  }
  function foot(p, a, b) {
    const vx = b.x - a.x, vy = b.y - a.y;
    const t = clamp(((p.x - a.x) * vx + (p.y - a.y) * vy) / (vx*vx + vy*vy), 0, 1);
    return { x: a.x + vx * t, y: a.y + vy * t };
  }

  // note log: recent pulses as bars, time running left to right
  const LOG_SECONDS = 8, F_LO = 50, F_HI = 800;
  const noteLog = [];
  let logRaf = null;
  function freqY(f, top, bottom) {
    const t = (Math.log2(f) - Math.log2(F_LO)) / (Math.log2(F_HI) - Math.log2(F_LO));
    return bottom - clamp(t, 0, 1) * (bottom - top);
  }
  function drawLog() {
    const W = logCanvas.width, H = logCanvas.height;
    const L = 78, Rt = W - 24, T = 30, B = H - 70;
    lctx.fillStyle = PAPER; lctx.fillRect(0,0,W,H);

    lctx.font = `22px ${FONT}`; lctx.fillStyle = INK; lctx.textAlign = 'right'; lctx.textBaseline = 'middle';
    lctx.setLineDash([6, 6]); lctx.strokeStyle = FAINT; lctx.lineWidth = 1.5;
    [55, 110, 220, 440].forEach(f => {
      const y = freqY(f, T, B);
      lctx.beginPath(); lctx.moveTo(L, y); lctx.lineTo(Rt, y); lctx.stroke();
      lctx.fillText(f, L - 10, y);
    });
    lctx.setLineDash([]);
    lctx.strokeStyle = INK; lctx.lineWidth = 2;
    lctx.beginPath(); lctx.moveTo(L, T); lctx.lineTo(L, B); lctx.lineTo(Rt, B); lctx.stroke();
    lctx.textAlign = 'center'; lctx.textBaseline = 'alphabetic';
    for (let s = 0; s <= LOG_SECONDS; s += 2) {
      const x = Rt - (s / LOG_SECONDS) * (Rt - L);
      lctx.fillText(s === 0 ? 'now' : `−${s}s`, x, B + 30);
    }
    lctx.textAlign = 'right'; lctx.fillStyle = MUTED; lctx.fillText('Hz', L - 10, T - 6);

    if (!audioCtx || !noteLog.length) {
      lctx.textAlign = 'center'; lctx.fillStyle = MUTED;
      lctx.fillText(schedulerId ? 'listening…' : 'press start audio', (L + Rt) / 2, (T + B) / 2);
      return;
    }
    const now = audioCtx.currentTime;
    while (noteLog.length && noteLog[0].end < now - LOG_SECONDS) noteLog.shift();
    const xOf = t => Rt - ((now - t) / LOG_SECONDS) * (Rt - L);
    noteLog.forEach(n => {
      if (n.start > now) return;
      const x0 = Math.max(L + 1, xOf(n.start)), x1 = Math.max(x0 + 2, xOf(Math.min(n.end, now)));
      lctx.fillStyle = n.voice === 1 ? RED : BLUE;
      lctx.fillRect(x0, freqY(n.freq, T, B) - (n.voice === 1 ? 4 : 2), x1 - x0, n.voice === 1 ? 8 : 5);
    });
  }
  function logLoop() {
    drawLog();
    logRaf = (schedulerId || noteLog.some(n => n.end > audioCtx.currentTime - LOG_SECONDS)) ? requestAnimationFrame(logLoop) : null;
  }
  function midpoint(a,b){ return { x:(a.x+b.x)/2, y:(a.y+b.y)/2 }; }

  async function ensureAudio() {
    if (!audioCtx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();
      masterGain = audioCtx.createGain(); dryGain = audioCtx.createGain(); wetGain = audioCtx.createGain();
      delayNode = audioCtx.createDelay(2.5); feedbackGain = audioCtx.createGain(); hpWet = audioCtx.createBiquadFilter(); hpWet.type = 'highpass'; hpWet.frequency.value = 180;
      dryGain.connect(masterGain); wetGain.connect(delayNode); delayNode.connect(feedbackGain); feedbackGain.connect(delayNode); delayNode.connect(hpWet); hpWet.connect(masterGain); masterGain.connect(audioCtx.destination);
      updateGlobals();
    }
    if (audioCtx.state === 'suspended') await audioCtx.resume();
  }
  function updateGlobals() {
    if (!audioCtx) return;
    const s = getState();
    const now = audioCtx.currentTime;
    masterGain.gain.setTargetAtTime(s.master, now, .02);
    dryGain.gain.setTargetAtTime(1 - s.W * .65, now, .05);
    wetGain.gain.setTargetAtTime(.12 + s.W * s.D * .65, now, .05);
    delayNode.delayTime.setTargetAtTime(lerp(.08,.6, clamp(s.D * .85 + s.overlap * .25, 0, 1)), now, .05);
    feedbackGain.gain.setTargetAtTime(clamp(.08 + s.D * .52 - s.C * .22, .03, .72), now, .05);
  }
  function pulseInterval(state) {
    const base = 1 / state.rate;
    const overlapFactor = 1 - state.overlap * .72;
    const jitter = (Math.random() * 2 - 1) * state.irr * base * .45;
    return Math.max(.045, base * overlapFactor + jitter);
  }
  function scaleSemis(mode) {
    const map = {
      aminor_sparse: [0, 3, 5, 7, 10, 12],
      aminor_full: [0, 2, 3, 5, 7, 8, 10, 12],
      aminor_penta: [0, 3, 5, 7, 10, 12],
      aharmonic: [0, 2, 3, 5, 7, 8, 11, 12],
      adorian: [0, 2, 3, 5, 7, 9, 10, 12],
      aphrygian: [0, 1, 3, 5, 7, 8, 10, 12]
    };
    return map[mode] || map.aminor_sparse;
  }
  function scalePool(baseFreq, mode) {
    return scaleSemis(mode).map(semi => baseFreq * Math.pow(2, semi / 12));
  }
  function chooseNotePair(state, index) {
    const pool1 = scalePool(state.F, state.scaleMode);
    const pool2 = scalePool(state.F2, state.scaleMode);
    const phaseBias = Math.sin(index * (0.73 + state.R * 0.22) + state.T * Math.PI * 0.5) * 0.5 + 0.5;
    const rand = Math.random() * (0.35 + (1 - state.T) * 0.4);
    const composite = clamp(phaseBias * .72 + rand * .28 + state.R * .06, 0, .999);
    const idx = Math.min(pool1.length - 1, Math.floor(composite * pool1.length));
    let overtoneFreq;
    if (state.invertMode === 'same') {
      overtoneFreq = pool2[Math.min(pool2.length - 1, idx)];
    } else if (state.invertMode === 'fifth') {
      overtoneFreq = pool2[Math.min(pool2.length - 1, (idx + 2) % pool2.length)];
    } else if (state.invertMode === 'octave_down') {
      const invIdx = pool2.length - 1 - idx;
      overtoneFreq = pool2[invIdx] * 0.5;
    } else {
      const invIdx = pool2.length - 1 - idx;
      overtoneFreq = pool2[invIdx];
    }
    return { mainFreq: pool1[idx], overtoneFreq };
  }
  function scheduler() {
    if (!audioCtx) return;
    while (nextPulseTime < audioCtx.currentTime + .12) {
      triggerVoice(nextPulseTime, pulseIndex++);
      nextPulseTime += pulseInterval(getState());
    }
  }
  function buildVoice(time, freq, type, peak, attack, decay, sustainAmp, release, filterMode, cutoff, q, pan, sendAmt) {
    const osc = audioCtx.createOscillator(), amp = audioCtx.createGain(), filter = audioCtx.createBiquadFilter(), panner = audioCtx.createStereoPanner(), send = audioCtx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, time);
    filter.type = filterMode; filter.frequency.setValueAtTime(cutoff, time); filter.Q.setValueAtTime(q, time);
    panner.pan.setValueAtTime(pan, time); send.gain.setValueAtTime(sendAmt, time);
    amp.gain.setValueAtTime(.0001, time);
    amp.gain.linearRampToValueAtTime(peak, time + attack);
    amp.gain.linearRampToValueAtTime(sustainAmp, time + attack + decay);
    amp.gain.setValueAtTime(sustainAmp, time + attack + decay + .02);
    amp.gain.exponentialRampToValueAtTime(.0001, time + attack + decay + .02 + release);
    osc.connect(filter); filter.connect(amp); amp.connect(panner); panner.connect(dryGain); panner.connect(send); send.connect(wetGain);
    osc.start(time); osc.stop(time + attack + decay + release + .08);
    osc.onended = () => { try { osc.disconnect(); filter.disconnect(); amp.disconnect(); panner.disconnect(); send.disconnect(); } catch(_){} };
  }
  function triggerVoice(time, index) {
    const s = getState();
    const phase = index * (0.65 + 0.35 * s.rate) + (1 - s.T) * (Math.random() * Math.PI * 1.4 - Math.PI * .7);
    const notes = chooseNotePair(s, index);
    const mainFreq = notes.mainFreq * (1 + Math.sin(phase) * s.R * .012 + (Math.random() * 2 - 1) * (1 - s.T) * .006);
    const cutoff = clamp(lerp(480, 4200, 1 - s.C * .82 + s.R * .18) * (.85 + s.A * .5), 180, 8000);
    const pan = clamp(Math.sin(phase) * (.15 + s.R * .75 + s.D * .15), -1, 1);
    const attack = lerp(s.attack * .65, s.attack * 1.45, 1 - s.C * .65 + s.R * .15);
    const decay = lerp(s.decay * .7, s.decay * 1.25, .35 + s.D * .4);
    const sustain = clamp(s.sustain * (.7 + s.D * .25 - s.C * .1 + s.R * .1), 0, 1);
    const release = lerp(s.release * .6, s.release * 1.55, .2 + s.D * .4 + s.overlap * .2 - s.C * .15);
    const peak = clamp((.015 + s.A * .075) * (1 + s.R * .1), .01, .12);
    const sustainAmp = peak * sustain;
    const sendAmt = clamp(.04 + s.D * s.W * .45, 0, .7);
    noteLog.push({ voice: 1, freq: mainFreq, start: time, end: time + attack + decay + .02 + release * .5 });
    buildVoice(time, mainFreq, s.oscType, peak, attack, decay, sustainAmp, release, 'lowpass', cutoff, 1 + s.R * 5 + s.D * .5, pan, sendAmt);

    const overtoneFreq = notes.overtoneFreq * (1 + Math.sin(phase * 1.21 + .4) * .008);
    const overtonePeak = peak * s.src2Mix * clamp(.8 + s.A * .18 + s.R * .12 + (1 - s.T) * .04, .65, 1.15);
    const overtoneAttack = Math.max(.002, attack * (.48 + s.C * .08));
    const overtoneDecay = Math.max(.015, decay * (.62 + s.R * .08));
    const overtoneRelease = Math.max(.03, release * (.55 + s.D * .08));
    const overtoneSustain = overtonePeak * clamp(.14 + s.overlap * .18 + s.D * .06, .06, .24);
    const overtonePan = clamp(pan * .55 + Math.sin(phase * 1.4) * .07, -1, 1);
    const overtoneCutoff = clamp(cutoff * (1.08 + s.R * .18), 350, 7500);
    const overtoneSend = clamp(sendAmt * (.7 + s.D * .2), 0, .75);
    if (s.src2Mix > 0) noteLog.push({ voice: 2, freq: overtoneFreq, start: time + .012, end: time + .012 + overtoneAttack + overtoneDecay + .02 + overtoneRelease * .5 });
    buildVoice(time + .012, overtoneFreq, s.oscType2, overtonePeak, overtoneAttack, overtoneDecay, overtoneSustain, overtoneRelease, 'bandpass', overtoneCutoff, 2.2 + s.R * 3.5, overtonePan, overtoneSend);
  }
  async function startAudio() {
    await ensureAudio();
    if (schedulerId) return;
    nextPulseTime = audioCtx.currentTime + .02;
    schedulerId = setInterval(scheduler, 25);
    values.audioStatus.textContent = 'running'; values.audioStatus.classList.add('on');
    if (!logRaf) logLoop();
  }
  function stopAudio() {
    if (schedulerId) { clearInterval(schedulerId); schedulerId = null; }
    values.audioStatus.textContent = 'idle'; values.audioStatus.classList.remove('on');
  }

  function setPreset(name) {
    const presets = { center:{C:.33,D:.33,R:.34}, containment:{C:.75,D:.15,R:.10}, diffusion:{C:.12,D:.76,R:.12}, direction:{C:.12,D:.13,R:.75}, cdEdge:{C:.46,D:.46,R:.08}, drEdge:{C:.08,D:.46,R:.46}, rcEdge:{C:.46,D:.08,R:.46} };
    const p = presets[name]; if (!p) return; point = baryToPoint(p.C,p.D,p.R); updateReadout();
  }
  function eventPoint(e) {
    const rect = canvas.getBoundingClientRect(), scaleX = canvas.width / rect.width, scaleY = canvas.height / rect.height;
    if (e.touches && e.touches[0]) return { x: (e.touches[0].clientX - rect.left) * scaleX, y: (e.touches[0].clientY - rect.top) * scaleY };
    return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
  }
  function startDrag(e){ dragging = true; point = clampToTriangle(eventPoint(e)); updateReadout(); }
  function moveDrag(e){ if (!dragging) return; point = clampToTriangle(eventPoint(e)); updateReadout(); }
  function endDrag(){ dragging = false; }

  canvas.addEventListener('mousedown', startDrag);
  window.addEventListener('mousemove', moveDrag);
  window.addEventListener('mouseup', endDrag);
  canvas.addEventListener('touchstart', e => { e.preventDefault(); startDrag(e); }, { passive:false });
  window.addEventListener('touchmove', e => { if (dragging) { e.preventDefault(); moveDrag(e); } }, { passive:false });
  window.addEventListener('touchend', endDrag);
  Object.values(controls).forEach(node => node.addEventListener('input', updateReadout));
  document.querySelectorAll('[data-preset]').forEach(btn => btn.addEventListener('click', () => setPreset(btn.dataset.preset)));
  el('startAudio').addEventListener('click', startAudio); el('stopAudio').addEventListener('click', stopAudio);
  updateReadout();
})();
</script>
</body>
</html>
