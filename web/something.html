<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Art System · Ontology Editor</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  :root {
    --bg: #f4f4f4;
    --ink: #111;
    --muted: #777;
    --panel-bg: #ffffff;
    --rule: #dddddd;
    --line: #cccccc;
    --line-active: #111;
    --node-fill: #ffffff;
    --node-stroke: #222;
    --radius: 16;
    --font: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
  }
  body {
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 0.6rem 0.9rem;
    font-size: 0.8rem;
    text-transform: lowercase;
    letter-spacing: 0.06em;
    border-bottom: 1px solid var(--rule);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  header span { color: var(--muted); }
  .toolbar {
    display: flex;
    gap: 0.4rem;
    padding: 0.55rem 0.9rem;
    border-bottom: 1px solid var(--rule);
    flex-wrap: wrap;
    background: #fafafa;
  }
  .toolbar button, .toolbar label {
    border: 1px solid var(--rule);
    background: white;
    padding: 0.35rem 0.55rem;
    font-size: 0.78rem;
    border-radius: 7px;
    cursor: pointer;
  }
  .toolbar input[type="file"] { display: none; }

  .main {
    flex: 1;
    display: flex;
    min-height: 0;
  }
  .graph-wrap {
    flex: 1;
    min-width: 0;
    position: relative;
  }
  svg {
    width: 100%;
    height: 100%;
    display: block;
    background: var(--bg);
    touch-action: none;
  }
  .panel {
    width: 320px;
    max-width: 45%;
    border-left: 1px solid var(--rule);
    background: var(--panel-bg);
    padding: 0.9rem;
    display: flex;
    flex-direction: column;
    gap: 0.55rem;
    font-size: 0.8rem;
    overflow: auto;
  }
  .panel-title {
    font-size: 0.9rem;
    font-weight: 600;
    text-transform: lowercase;
  }
  .hint { color: var(--muted); line-height: 1.4; }
  .field {
    display: flex;
    flex-direction: column;
    gap: 0.2rem;
  }
  .field label {
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .field input, .field textarea {
    width: 100%;
    font: inherit;
    border: 1px solid var(--rule);
    border-radius: 8px;
    padding: 0.45rem 0.55rem;
    background: #fff;
    color: var(--ink);
  }
  .field textarea {
    min-height: 90px;
    resize: vertical;
    line-height: 1.45;
  }
  .mini {
    font-size: 0.72rem;
    color: var(--muted);
  }

  .link {
    stroke: var(--line);
    stroke-width: 1.4;
    stroke-linecap: round;
    transition: stroke 0.15s ease, stroke-width 0.15s ease, opacity 0.15s ease;
    cursor: pointer;
  }
  .link.active {
    stroke: var(--line-active);
    stroke-width: 2.2;
  }
  .link.dimmed { opacity: 0.2; }

  .node-group { cursor: pointer; }
  .node-circle {
    fill: var(--node-fill);
    stroke: var(--node-stroke);
    stroke-width: 1;
  }
  .node-label {
    font-size: 11px;
    fill: var(--ink);
    pointer-events: none;
  }
  .node-group.hover .node-circle,
  .node-group.selected .node-circle {
    stroke-width: 2;
  }
  .node-group.dimmed { opacity: 0.35; }

  .zoom-controls {
    position: absolute;
    left: 0.6rem;
    bottom: 0.6rem;
    display: flex;
    gap: 0.25rem;
    z-index: 10;
  }
  .zoom-btn {
    border: 1px solid var(--rule);
    background: rgba(255,255,255,0.92);
    padding: 0.15rem 0.45rem;
    font-size: 0.8rem;
    border-radius: 6px;
    cursor: pointer;
  }

  @media (max-width: 768px) {
    .main { flex-direction: column; }
    .panel {
      width: 100%;
      max-width: 100%;
      border-left: none;
      border-top: 1px solid var(--rule);
    }
    .graph-wrap { height: 52vh; }
  }
</style>
</head>
<body>
<header>
  <div>art system · ontology editor</div>
  <span>drag nodes · drag background to pan · click to edit</span>
</header>

<div class="toolbar">
  <button id="addNodeBtn">add node</button>
  <button id="startLinkBtn">new link</button>
  <button id="deleteBtn">delete selected</button>
  <button id="exportBtn">export json</button>
  <label for="importFile">import json</label>
  <input id="importFile" type="file" accept="application/json" />
</div>

<div class="main">
  <div class="graph-wrap">
    <svg id="graphSvg" viewBox="0 0 1000 500" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="zoom-controls">
      <button class="zoom-btn" id="zoomIn">+</button>
      <button class="zoom-btn" id="zoomOut">−</button>
      <button class="zoom-btn" id="zoomReset">reset</button>
    </div>
  </div>

  <aside class="panel">
    <div class="panel-title" id="panelTitle">nothing selected</div>
    <div class="hint" id="panelHint">
      Select a node or link. Nodes can be dragged. Use “new link” and then click a target node.
    </div>

    <div id="editor"></div>
  </aside>
</div>

<script>
const ontology = {
  nodes: [
    { id: "feelings", label: "feelings", type: "field", tags: ["affect","mood","field"], body: "Emotional field.", x: 260, y: 120 },
    { id: "memories", label: "memories", type: "field", tags: ["traces","history"], body: "Accumulated traces.", x: 500, y: 120 },
    { id: "thoughts", label: "thoughts", type: "field", tags: ["meaning","decisions"], body: "Interpretation and strategy.", x: 740, y: 120 },
    { id: "recursion", label: "recursion", type: "engine", tags: ["feedback","mutation"], body: "Reprocessing loop.", x: 500, y: 200 },
    { id: "static", label: "static (prints)", type: "visual", tags: ["prints","frames"], body: "Still artifacts.", x: 260, y: 280 },
    { id: "fragments", label: "fragments", type: "material", tags: ["cuts","loops"], body: "Shared fragments.", x: 500, y: 280 },
    { id: "movement", label: "movement (videos)", type: "visual", tags: ["video","flow"], body: "Time-based image work.", x: 740, y: 280 }
  ],
  links: [
    { id: "l1", from: "thoughts", to: "memories", relation: "shapes" },
    { id: "l2", from: "memories", to: "feelings", relation: "feeds" },
    { id: "l3", from: "feelings", to: "thoughts", relation: "biases" },
    { id: "l4", from: "fragments", to: "recursion", relation: "enters" },
    { id: "l5", from: "recursion", to: "movement", relation: "generates" },
    { id: "l6", from: "movement", to: "static", relation: "freezes into" },
    { id: "l7", from: "static", to: "fragments", relation: "breaks into" }
  ]
};

const svg = document.getElementById("graphSvg");
const editor = document.getElementById("editor");
const panelTitle = document.getElementById("panelTitle");
const panelHint = document.getElementById("panelHint");

let selected = null; // { kind: 'node'|'link', id: '...' }
let linkingFrom = null;
let isPanning = false;
let dragNodeId = null;

let viewBox = { x: 0, y: 0, w: 1000, h: 500 };
const minW = 300;
const maxW = 2400;

function applyViewBox() {
  svg.setAttribute("viewBox", `${viewBox.x} ${viewBox.y} ${viewBox.w} ${viewBox.h}`);
}
applyViewBox();

function getNode(id) {
  return ontology.nodes.find(n => n.id === id);
}
function getLink(id) {
  return ontology.links.find(l => l.id === id);
}
function uid(prefix="id") {
  return prefix + "-" + Math.random().toString(36).slice(2, 9);
}
function escapeHtml(str="") {
  return String(str)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");
}
function parseTags(str) {
  return str.split(",").map(s => s.trim()).filter(Boolean);
}
function graphPointFromClient(clientX, clientY) {
  const rect = svg.getBoundingClientRect();
  return {
    x: viewBox.x + ((clientX - rect.left) / rect.width) * viewBox.w,
    y: viewBox.y + ((clientY - rect.top) / rect.height) * viewBox.h
  };
}
function connectedNodeIds(nodeId) {
  const ids = new Set();
  ontology.links.forEach(l => {
    if (l.from === nodeId) ids.add(l.to);
    if (l.to === nodeId) ids.add(l.from);
  });
  return ids;
}
function clearSelection() {
  selected = null;
  render();
}
function selectNode(id) {
  selected = { kind: "node", id };
  render();
}
function selectLink(id) {
  selected = { kind: "link", id };
  render();
}

function zoomAt(factor, centerX, centerY) {
  const { x, y, w, h } = viewBox;
  const cx = centerX ?? (x + w / 2);
  const cy = centerY ?? (y + h / 2);

  let newW = Math.max(minW, Math.min(maxW, w * factor));
  let newH = newW * (h / w);
  const scale = newW / w;

  viewBox = {
    w: newW,
    h: newH,
    x: cx - (cx - x) * scale,
    y: cy - (cy - y) * scale
  };
  applyViewBox();
}

svg.addEventListener("wheel", (e) => {
  e.preventDefault();
  const p = graphPointFromClient(e.clientX, e.clientY);
  zoomAt(e.deltaY < 0 ? 0.9 : 1.1, p.x, p.y);
}, { passive: false });

document.getElementById("zoomIn").addEventListener("click", () => zoomAt(0.9));
document.getElementById("zoomOut").addEventListener("click", () => zoomAt(1.1));
document.getElementById("zoomReset").addEventListener("click", () => {
  viewBox = { x: 0, y: 0, w: 1000, h: 500 };
  applyViewBox();
});

document.getElementById("addNodeBtn").addEventListener("click", () => {
  const id = uid("node");
  const node = {
    id,
    label: "new node",
    type: "concept",
    tags: [],
    body: "",
    x: viewBox.x + viewBox.w / 2,
    y: viewBox.y + viewBox.h / 2
  };
  ontology.nodes.push(node);
  selectNode(id);
});

document.getElementById("startLinkBtn").addEventListener("click", () => {
  if (selected?.kind !== "node") {
    alert("Select a source node first.");
    return;
  }
  linkingFrom = selected.id;
  panelHint.textContent = "Link mode active: click another node to create a relation.";
});

document.getElementById("deleteBtn").addEventListener("click", () => {
  if (!selected) return;
  if (selected.kind === "node") {
    ontology.links = ontology.links.filter(l => l.from !== selected.id && l.to !== selected.id);
    ontology.nodes = ontology.nodes.filter(n => n.id !== selected.id);
  } else {
    ontology.links = ontology.links.filter(l => l.id !== selected.id);
  }
  selected = null;
  linkingFrom = null;
  render();
});

document.getElementById("exportBtn").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify(ontology, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "ontology.json";
  a.click();
  URL.revokeObjectURL(a.href);
});

document.getElementById("importFile").addEventListener("change", async (e) => {
  const file = e.target.files?.[0];
  if (!file) return;
  const text = await file.text();
  try {
    const parsed = JSON.parse(text);
    if (!Array.isArray(parsed.nodes) || !Array.isArray(parsed.links)) {
      throw new Error("Invalid ontology shape.");
    }
    ontology.nodes = parsed.nodes;
    ontology.links = parsed.links;
    selected = null;
    linkingFrom = null;
    render();
  } catch (err) {
    alert("Could not import JSON.");
  }
});

function renderEditor() {
  if (!selected) {
    panelTitle.textContent = "nothing selected";
    panelHint.textContent = linkingFrom
      ? "Link mode active: click a target node."
      : "Select a node or link. Nodes can be dragged. Use “new link” and then click a target node.";
    editor.innerHTML = "";
    return;
  }

  if (selected.kind === "node") {
    const n = getNode(selected.id);
    if (!n) return;
    panelTitle.textContent = n.label || "node";
    panelHint.textContent = linkingFrom
      ? `Link mode active from “${getNode(linkingFrom)?.label || linkingFrom}”.`
      : "Edit node properties below.";

    editor.innerHTML = `
      <div class="field">
        <label>id</label>
        <input id="f-id" value="${escapeHtml(n.id)}" />
        <div class="mini">Changing ids will also update connected links.</div>
      </div>
      <div class="field">
        <label>label</label>
        <input id="f-label" value="${escapeHtml(n.label || "")}" />
      </div>
      <div class="field">
        <label>type</label>
        <input id="f-type" value="${escapeHtml(n.type || "")}" />
      </div>
      <div class="field">
        <label>tags (comma separated)</label>
        <input id="f-tags" value="${escapeHtml((n.tags || []).join(", "))}" />
      </div>
      <div class="field">
        <label>body</label>
        <textarea id="f-body">${escapeHtml(n.body || "")}</textarea>
      </div>
      <div class="field">
        <label>connections</label>
        <div class="mini">${[...connectedNodeIds(n.id)].map(id => getNode(id)?.label || id).join(" · ") || "none"}</div>
      </div>
    `;

    const oldId = n.id;
    editor.querySelector("#f-id").addEventListener("input", e => {
      const nextId = e.target.value.trim();
      if (!nextId) return;
      ontology.nodes.forEach(node => {
        if (node.id === oldId) node.id = nextId;
      });
      ontology.links.forEach(l => {
        if (l.from === oldId) l.from = nextId;
        if (l.to === oldId) l.to = nextId;
      });
      selected.id = nextId;
      if (linkingFrom === oldId) linkingFrom = nextId;
      render();
    });
    editor.querySelector("#f-label").addEventListener("input", e => { n.label = e.target.value; render(false); });
    editor.querySelector("#f-type").addEventListener("input", e => { n.type = e.target.value; render(false); });
    editor.querySelector("#f-tags").addEventListener("input", e => { n.tags = parseTags(e.target.value); });
    editor.querySelector("#f-body").addEventListener("input", e => { n.body = e.target.value; });
    return;
  }

  if (selected.kind === "link") {
    const l = getLink(selected.id);
    if (!l) return;
    panelTitle.textContent = l.relation || "link";
    panelHint.textContent = "Edit relation properties below.";

    const nodeOptions = ontology.nodes.map(n =>
      `<option value="${escapeHtml(n.id)}" ${n.id === l.from ? "selected" : ""}>${escapeHtml(n.label)}</option>`
    ).join("");

    const targetOptions = ontology.nodes.map(n =>
      `<option value="${escapeHtml(n.id)}" ${n.id === l.to ? "selected" : ""}>${escapeHtml(n.label)}</option>`
    ).join("");

    editor.innerHTML = `
      <div class="field">
        <label>id</label>
        <input id="l-id" value="${escapeHtml(l.id)}" />
      </div>
      <div class="field">
        <label>from</label>
        <select id="l-from">${nodeOptions}</select>
      </div>
      <div class="field">
        <label>to</label>
        <select id="l-to">${targetOptions}</select>
      </div>
      <div class="field">
        <label>relation</label>
        <input id="l-relation" value="${escapeHtml(l.relation || "")}" />
      </div>
    `;

    editor.querySelector("#l-id").addEventListener("input", e => { l.id = e.target.value.trim() || l.id; selected.id = l.id; });
    editor.querySelector("#l-from").addEventListener("change", e => { l.from = e.target.value; render(); });
    editor.querySelector("#l-to").addEventListener("change", e => { l.to = e.target.value; render(); });
    editor.querySelector("#l-relation").addEventListener("input", e => { l.relation = e.target.value; render(false); });
  }
}

function render(redrawGraph = true) {
  if (redrawGraph) {
    svg.innerHTML = "";

    const defs = document.createElementNS("http://www.w3.org/2000/svg", "defs");
    defs.innerHTML = `
      <marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L10,4 L0,8 z" fill="#999"></path>
      </marker>
      <marker id="arrowActive" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L10,4 L0,8 z" fill="#111"></path>
      </marker>
    `;
    svg.appendChild(defs);

    ontology.links.forEach(link => {
      const a = getNode(link.from);
      const b = getNode(link.to);
      if (!a || !b) return;

      const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line.setAttribute("x1", a.x);
      line.setAttribute("y1", a.y);
      line.setAttribute("x2", b.x);
      line.setAttribute("y2", b.y);
      line.setAttribute("marker-end", selected?.kind === "link" && selected.id === link.id ? "url(#arrowActive)" : "url(#arrow)");
      line.classList.add("link");

      if (selected?.kind === "node") {
        if (link.from === selected.id || link.to === selected.id) line.classList.add("active");
        else line.classList.add("dimmed");
      }
      if (selected?.kind === "link" && selected.id === link.id) {
        line.classList.add("active");
      }

      line.addEventListener("click", (e) => {
        e.stopPropagation();
        selectLink(link.id);
      });

      svg.appendChild(line);

      const mx = (a.x + b.x) / 2;
      const my = (a.y + b.y) / 2;
      const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
      text.setAttribute("x", mx + 6);
      text.setAttribute("y", my - 4);
      text.setAttribute("font-size", "10");
      text.setAttribute("fill", "#777");
      text.textContent = link.relation || "";
      svg.appendChild(text);
    });

    ontology.nodes.forEach(node => {
      const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
      g.classList.add("node-group");
      if (selected?.kind === "node" && selected.id === node.id) g.classList.add("selected");
      if (selected?.kind === "node" && selected.id !== node.id) {
        const neighbors = connectedNodeIds(selected.id);
        if (!neighbors.has(node.id)) g.classList.add("dimmed");
      }

      const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      c.classList.add("node-circle");
      c.setAttribute("cx", node.x);
      c.setAttribute("cy", node.y);
      c.setAttribute("r", 16);

      const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
      t.classList.add("node-label");
      t.setAttribute("x", node.x + 20);
      t.setAttribute("y", node.y + 4);
      t.textContent = node.label;

      g.appendChild(c);
      g.appendChild(t);

      g.addEventListener("click", (e) => {
        e.stopPropagation();
        if (linkingFrom && linkingFrom !== node.id) {
          ontology.links.push({
            id: uid("link"),
            from: linkingFrom,
            to: node.id,
            relation: "relates to"
          });
          linkingFrom = null;
        }
        selectNode(node.id);
      });

      g.addEventListener("pointerdown", (e) => {
        e.stopPropagation();
        dragNodeId = node.id;
        svg.setPointerCapture(e.pointerId);
      });

      svg.appendChild(g);
    });

    applyViewBox();
  }

  renderEditor();
}

svg.addEventListener("click", () => {
  clearSelection();
});

let panStart = { x: 0, y: 0 };
let vbStart = { x: 0, y: 0 };

svg.addEventListener("pointerdown", (e) => {
  if (e.target.closest(".node-group")) return;
  isPanning = true;
  panStart = { x: e.clientX, y: e.clientY };
  vbStart = { x: viewBox.x, y: viewBox.y };
  svg.setPointerCapture(e.pointerId);
});

svg.addEventListener("pointermove", (e) => {
  if (dragNodeId) {
    const node = getNode(dragNodeId);
    if (!node) return;
    const p = graphPointFromClient(e.clientX, e.clientY);
    node.x = p.x;
    node.y = p.y;
    render();
    return;
  }

  if (!isPanning) return;
  const rect = svg.getBoundingClientRect();
  const dx = ((e.clientX - panStart.x) / rect.width) * viewBox.w;
  const dy = ((e.clientY - panStart.y) / rect.height) * viewBox.h;
  viewBox.x = vbStart.x - dx;
  viewBox.y = vbStart.y - dy;
  applyViewBox();
});

svg.addEventListener("pointerup", (e) => {
  dragNodeId = null;
  isPanning = false;
  try { svg.releasePointerCapture(e.pointerId); } catch {}
});

svg.addEventListener("pointercancel", () => {
  dragNodeId = null;
  isPanning = false;
});

render();
</script>
</body>
</html>
