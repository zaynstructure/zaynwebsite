<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Free Items · CircleShare</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

<!-- HEADER -->
<header class="top-header">
  <div class="header-inner">
    <div class="logo">CircleShare</div>

    <div class="header-right">
      <a href="dashboard.html" class="small-arrow">→</a>
      <a id="logoutBtn" class="logout-link">Logout</a>
    </div>
  </div>
</header>

<style>
.top-header {
  background:#fff;
  border-bottom:1px solid #ddd;
}
.header-inner {
  max-width:600px;
  margin:0 auto;
  padding:0.8rem 1rem;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.small-arrow, .logout-link {
  font-size:0.85rem;
  color:#333;
  text-decoration:none;
  margin-left:0.6rem;
}
.small-arrow:hover, .logout-link:hover {
  text-decoration:underline;
}
.header-right {
  display:flex;
  align-items:center;
}
</style>

<script>
document.getElementById("logoutBtn")?.addEventListener("click", () => {
  localStorage.removeItem("logged_in");
  window.location.href = "index.html";
});
</script>

<main class="page" style="padding-top:1rem;">

  <h1 class="section-title">Free Food & Clothing</h1>

  <p style="font-size:0.9rem; color:#555; margin-bottom:1rem;">
    No borrowing process. No requirements.<br>
    Just take what you need or share what you can.
  </p>

  <a class="btn btn-primary" href="add_free.html" style="margin-bottom:1.2rem;">
    Add something
  </a>

  <!-- Filter -->
  <div style="display:flex; gap:0.6rem; margin-bottom:1.2rem;">
    <select id="filter-category">
      <option value="">All categories</option>
      <option value="Food">Food</option>
      <option value="Clothing">Clothing</option>
    </select>

    <select id="filter-area">
      <option value="">All areas</option>
      <option value="Quadra Village">Quadra Village</option>
      <option value="Burnside">Burnside</option>
      <option value="Downtown">Downtown</option>
      <!-- Add more if needed -->
    </select>
  </div>

  <!-- Container where dynamic cards will go -->
  <div id="free-list"></div>

</main>

<!-- FOOTER NAV -->
<footer>
  <div class="footer-nav">
    <a href="dashboard.html">Home</a>
    <a href="circles.html">Circles</a>
    <a href="library.html">Borrow/Lend</a>
    <a href="free.html">Give/Receive</a>
    <a href="info.html">Info</a>
  </div>
</footer>

<script>
/* ================================
   DYNAMIC FREE ITEMS + FILTERS
================================ */

let fullData = {};

async function loadFreeItems() {
  const container = document.getElementById("free-list");
  container.innerHTML = "";

  const category = document.getElementById("filter-category").value;
  const area = document.getElementById("filter-area").value;

  Object.keys(fullData).forEach(id => {
    const item = fullData[id];

    if (category && item.category !== category) return;
    if (area && item.location !== area) return;

    const card = document.createElement("div");
    card.className = "card";
    card.style.marginBottom = "1.2rem";

    card.innerHTML = `
      <h3>${item.title}</h3>
      <p>${item.category} • ${item.location}</p>
      <p style="color:#777;">${item.condition}</p>

      <div style="
        background:url('${item.image}') center/cover no-repeat;
        width:100%; height:160px; border-radius:6px;
        margin:0.7rem 0 1rem;
      "></div>

      <p style="font-size:0.88rem; color:#555; margin-bottom:1rem;">
        ${item.notes}
      </p>

      <a class="btn btn-ghost" href="free_item.html?id=${id}">
        View
      </a>
    `;

    container.appendChild(card);
  });
}

// Fetch then render
fetch("free.json")
  .then(r => r.json())
  .then(data => {
    fullData = data;
    loadFreeItems();
  });

document.getElementById("filter-category").addEventListener("change", loadFreeItems);
document.getElementById("filter-area").addEventListener("change", loadFreeItems);
</script>

</body>
</html>
