<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CircleShare</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<!-- TOP RIGHT LOGIN/SIGNUP -->
<a href="signup.html" class="corner-auth">Login / Signup</a>

<style>
.corner-auth {
  position:absolute;
  top:0.9rem;
  right:1rem;
  font-size:0.85rem;
  text-decoration:none;
  color:#333;
}
</style>

<main class="page" style="padding-top:4rem; text-align:center;">

  <h1 class="section-title" style="margin-bottom:1.5rem;">CircleShare</h1>

  <!-- MAIN BUTTONS -->
  <div style="display:flex; flex-direction:column; gap:1rem; max-width:350px; margin:0 auto;">
    <a class="btn btn-primary btn-large" href="library.html">Borrow / Lend</a>
    <a class="btn btn-primary btn-large" href="free.html">Give / Receive</a>
    <a class="btn btn-primary btn-large" href="circles.html">Circles</a>
  </div>

  <!-- SMALL FAQ BUTTON -->
  <a class="btn btn-ghost" href="info.html" style="margin-top:1.2rem; font-size:0.85rem;">
    FAQ / About
  </a>

</main>

<!-- BOTTOM NAV (only shows for logged-in users) -->
<div id="bottomNavContainer"></div>

<script>
  // show bottom nav only if user is logged in
  if (localStorage.getItem("logged_in") === "true") {
    document.getElementById("bottomNavContainer").innerHTML = `
      <footer class="main-footer">
        <div class="footer-nav">
          <a href="dashboard.html">Home</a>
          <a href="circles.html">Circles</a>
          <a href="library.html">Borrow</a>
          <a href="free.html">Free</a>
          <a href="info.html">Info</a>
        </div>
      </footer>
    `;
  }
</script>

<style>
.main-footer {
  border-top:1px solid #ddd;
  background:#fff;
  padding:0.5rem 0;
  position:fixed;
  bottom:0;
  left:0;
  right:0;
}

.footer-nav {
  display:flex;
  justify-content:space-around;
  max-width:600px;
  margin:0 auto;
  font-size:0.85rem;
}

.footer-nav a {
  color:#444;
  text-decoration:none;
}
</style>

</body>
</html>
