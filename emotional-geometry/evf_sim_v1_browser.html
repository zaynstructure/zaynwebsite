<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EVF-Sim v1 Browser</title>
<style>
:root{--bg:#0f1115;--panel:#171a21;--text:#e8eaed;--muted:#a7b0be;--line:#2a3140;--accent:#7aa2ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,sans-serif}
.wrap{display:grid;grid-template-columns:320px 1fr;min-height:100vh}
.sidebar{padding:18px;border-right:1px solid var(--line);background:var(--panel)}
h1{margin:0 0 10px;font-size:20px}h2{margin:18px 0 8px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.control{margin:10px 0}label{display:flex;justify-content:space-between;gap:8px;margin-bottom:4px}input[type="range"]{width:100%}
button,select{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:#11151d;color:var(--text)}
button:hover{border-color:var(--accent);cursor:pointer}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.main{display:grid;grid-template-rows:auto 1fr auto}.topbar{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.canvas-wrap{display:grid;place-items:center;padding:16px}canvas{width:min(88vmin,920px);height:min(88vmin,920px);max-width:100%;max-height:calc(100vh - 180px);border:1px solid var(--line);background:#0d1016}
.status{padding:12px 16px;border-top:1px solid var(--line);color:var(--muted);font-family:ui-monospace,monospace;white-space:pre-wrap}
.small{color:var(--muted);font-size:12px}.pill{padding:4px 8px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<div class="wrap">
<aside class="sidebar">
<h1>EVF-Sim v1</h1>
<div class="small">Gradient flow on a fixed meaning landscape with optional noise, carving, and circulation.</div>

<h2>Landscape</h2>
<div class="control">
<label for="landscapePreset"><span>Preset</span></label>
<select id="landscapePreset">
<option value="dual">Dual basin + ridge</option>
<option value="single">Single basin</option>
<option value="anxiety">Anxiety valley</option>
</select>
</div>

<h2>Dynamics</h2>
<div class="control"><label for="noise"><span>Noise σ</span><span id="noiseVal"></span></label><input id="noise" type="range" min="0" max="0.25" step="0.005" value="0.05"></div>
<div class="control"><label for="drift"><span>Gradient pull</span><span id="driftVal"></span></label><input id="drift" type="range" min="0" max="2.5" step="0.01" value="1.0"></div>
<div class="control"><label for="carve"><span>Carving α</span><span id="carveVal"></span></label><input id="carve" type="range" min="0" max="0.08" step="0.001" value="0.010"></div>
<div class="control"><label for="relax"><span>Relaxation ε</span><span id="relaxVal"></span></label><input id="relax" type="range" min="0" max="0.01" step="0.0002" value="0.0008"></div>
<div class="control"><label for="circ"><span>Circulation ω</span><span id="circVal"></span></label><input id="circ" type="range" min="0" max="0.08" step="0.001" value="0.015"></div>
<div class="control"><label for="memDecay"><span>Memory decay</span><span id="memDecayVal"></span></label><input id="memDecay" type="range" min="0" max="0.02" step="0.0005" value="0.003"></div>

<h2>View</h2>
<div class="control">
<label><input id="showTrail" type="checkbox" checked> Show trajectory</label>
<label><input id="showOcc" type="checkbox"> Show occupancy heat</label>
</div>

<h2>Actions</h2>
<div class="row">
<button id="resetBtn">Reset</button>
<button id="pauseBtn">Pause</button>
</div>
<div class="control" style="margin-top:8px;"><button id="seedBtn">New random start</button></div>

<h2>Predicted regime</h2>
<div id="regimeBox" class="small"></div>
</aside>

<main class="main">
<div class="topbar">
<div><strong>Browser simulation</strong> <span class="pill">EVF-Sim Layer 0/1</span></div>
<div class="small">Start with noise, then carving, then circulation.</div>
</div>
<div class="canvas-wrap"><canvas id="canvas" width="840" height="840"></canvas></div>
<div id="status" class="status"></div>
</main>
</div>

<script>
(() => {
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const N = 140, W = canvas.width, H = canvas.height;
const worldMin = -2.5, worldMax = 2.5, worldSize = worldMax - worldMin;
const dx = worldSize / (N - 1);

const els = {
  landscapePreset: document.getElementById("landscapePreset"),
  noise: document.getElementById("noise"),
  drift: document.getElementById("drift"),
  carve: document.getElementById("carve"),
  relax: document.getElementById("relax"),
  circ: document.getElementById("circ"),
  memDecay: document.getElementById("memDecay"),
  showTrail: document.getElementById("showTrail"),
  showOcc: document.getElementById("showOcc"),
  resetBtn: document.getElementById("resetBtn"),
  pauseBtn: document.getElementById("pauseBtn"),
  seedBtn: document.getElementById("seedBtn"),
  regimeBox: document.getElementById("regimeBox"),
  status: document.getElementById("status"),
};
const valueLabels = {
  noise: document.getElementById("noiseVal"),
  drift: document.getElementById("driftVal"),
  carve: document.getElementById("carveVal"),
  relax: document.getElementById("relaxVal"),
  circ: document.getElementById("circVal"),
  memDecay: document.getElementById("memDecayVal"),
};

let Phi0, Phi, Cx, Cy, occ;
let particle, prevParticle, trajectory = [];
let paused = false, steps = 0;

function idx(i,j){ return j * N + i; }
function wx(i){ return worldMin + i * dx; }
function wy(j){ return worldMin + j * dx; }
function field(fill=0){ return new Float32Array(N*N).fill(fill); }
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function worldToCanvasX(x){ return ((x-worldMin)/worldSize)*W; }
function worldToCanvasY(y){ return ((y-worldMin)/worldSize)*H; }

function basePotential(x,y,preset){
  if (preset === "single") return 0.28*(x*x+y*y) - 2.3*Math.exp(-((x*x+y*y)/0.35));
  if (preset === "anxiety") return 0.28*x*x + 0.20*(Math.pow(y,4) - 1.9*y*y) + 0.35*Math.exp(-(x*x + Math.pow(y+0.1,2))/0.12);
  const basin1 = -2.2 * Math.exp(-(((x+0.9)**2 + (y+0.3)**2) / 0.22));
  const basin2 = -1.7 * Math.exp(-(((x-0.8)**2 + (y-0.7)**2) / 0.25));
  const ridge  =  0.9 * Math.exp(-(((x-0.1)**2 + (y+0.2)**2) / 0.12));
  const bowl   =  0.35 * (x*x + y*y);
  return bowl + basin1 + basin2 + ridge;
}
function initLandscape(){
  const preset = els.landscapePreset.value;
  Phi0 = field();
  for(let j=0;j<N;j++){
    const y = wy(j);
    for(let i=0;i<N;i++){
      const x = wx(i);
      Phi0[idx(i,j)] = basePotential(x,y,preset);
    }
  }
  Phi = new Float32Array(Phi0);
}
function randomStart(){
  const preset = els.landscapePreset.value;
  if (preset === "single") return {x:1.3*(Math.random()-0.5), y:1.3+0.4*(Math.random()-0.5)};
  if (preset === "anxiety") return {x:0.1+0.4*(Math.random()-0.5), y:1.3+0.3*(Math.random()-0.5)};
  return {x:0.15+0.5*(Math.random()-0.5), y:1.2+0.3*(Math.random()-0.5)};
}
function reset(){
  initLandscape(); Cx=field(); Cy=field(); occ=field();
  particle=randomStart(); prevParticle={...particle}; trajectory=[]; steps=0;
}
function sampleField(F,x,y){
  const fx=(x-worldMin)/dx, fy=(y-worldMin)/dx;
  const i=clamp(Math.floor(fx),0,N-2), j=clamp(Math.floor(fy),0,N-2);
  const tx=fx-i, ty=fy-j;
  const f00=F[idx(i,j)], f10=F[idx(i+1,j)], f01=F[idx(i,j+1)], f11=F[idx(i+1,j+1)];
  return (1-tx)*(1-ty)*f00 + tx*(1-ty)*f10 + (1-tx)*ty*f01 + tx*ty*f11;
}
function gradientAt(x,y){
  const eps=dx;
  const gx=(sampleField(Phi,x+eps,y)-sampleField(Phi,x-eps,y))/(2*eps);
  const gy=(sampleField(Phi,x,y+eps)-sampleField(Phi,x,y-eps))/(2*eps);
  return {x:gx,y:gy};
}
function applyKernel(F,px,py,amount,width){
  for(let j=0;j<N;j++){
    const y=wy(j);
    for(let i=0;i<N;i++){
      const x=wx(i);
      const r2=(x-px)*(x-px)+(y-py)*(y-py);
      const k=Math.exp(-r2/width);
      F[idx(i,j)] += amount*k;
    }
  }
}
function decayField(F,d){ const fac=1-d; for(let i=0;i<F.length;i++) F[i]*=fac; }

function step(){
  const dt=0.03, noise=+els.noise.value, drift=+els.drift.value;
  const carve=+els.carve.value, relax=+els.relax.value, circGain=+els.circ.value, memDecay=+els.memDecay.value;

  const grad=gradientAt(particle.x, particle.y);
  const circX=sampleField(Cx, particle.x, particle.y);
  const circY=sampleField(Cy, particle.x, particle.y);
  prevParticle={...particle};

  particle.x += (-grad.x*drift + circX)*dt + noise*(Math.random()-0.5);
  particle.y += (-grad.y*drift + circY)*dt + noise*(Math.random()-0.5);
  particle.x = clamp(particle.x, worldMin, worldMax);
  particle.y = clamp(particle.y, worldMin, worldMax);

  const vx=particle.x-prevParticle.x, vy=particle.y-prevParticle.y;
  trajectory.push({...particle});
  if (trajectory.length>1800) trajectory.shift();

  const ii=clamp(Math.floor((particle.x-worldMin)/dx),0,N-1);
  const jj=clamp(Math.floor((particle.y-worldMin)/dx),0,N-1);
  occ[idx(ii,jj)] += 1;

  if (carve>0) applyKernel(Phi, particle.x, particle.y, -carve, 0.08);
  if (circGain>0){
    applyKernel(Cx, particle.x, particle.y,  circGain*vy, 0.06);
    applyKernel(Cy, particle.x, particle.y, -circGain*vx, 0.06);
    decayField(Cx, memDecay); decayField(Cy, memDecay);
  }
  if (relax>0){
    for(let k=0;k<Phi.length;k++) Phi[k] += relax*(Phi0[k]-Phi[k]);
  }

  steps++;
  updateStatus(grad, circX, circY);
}
function occupancyMax(){ let m=0; for(let i=0;i<occ.length;i++) if(occ[i]>m) m=occ[i]; return m||1; }
function drawField(){
  const stepPx=W/N, showOcc=els.showOcc.checked, occMax=occupancyMax();
  for(let j=0;j<N;j++){
    for(let i=0;i<N;i++){
      const k=idx(i,j), v=Phi[k];
      let c=Math.floor(135 + v*55); c=clamp(c,20,235);
      let r=c,g=c,b=clamp(c+35,30,255);
      if(showOcc){
        const a=occ[k]/occMax;
        r=Math.floor(r*(1-a)+255*a); g=Math.floor(g*(1-a)+120*a); b=Math.floor(b*(1-a)+80*a);
      }
      ctx.fillStyle=`rgb(${r},${g},${b})`;
      ctx.fillRect(i*stepPx,j*stepPx,stepPx+1,stepPx+1);
    }
  }
}
function drawTrail(){
  if(!els.showTrail.checked || trajectory.length<2) return;
  ctx.strokeStyle="rgba(255,255,255,0.92)"; ctx.lineWidth=1.2; ctx.beginPath();
  for(let k=0;k<trajectory.length;k++){
    const p=trajectory[k], x=worldToCanvasX(p.x), y=worldToCanvasY(p.y);
    if(k===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.stroke();
}
function drawParticle(){
  const x=worldToCanvasX(particle.x), y=worldToCanvasY(particle.y);
  ctx.fillStyle="#ff5252"; ctx.beginPath(); ctx.arc(x,y,5.5,0,Math.PI*2); ctx.fill();
}
function draw(){ drawField(); drawTrail(); drawParticle(); }

function pathEntropy(){
  let total=0; for(let i=0;i<occ.length;i++) total += occ[i];
  if(!total) return 0;
  let Hs=0;
  for(let i=0;i<occ.length;i++){
    if(occ[i] <= 0) continue;
    const p=occ[i]/total; Hs -= p*Math.log(p);
  }
  return Hs;
}
function regimeGuess(){
  const n=+els.noise.value, a=+els.carve.value, c=+els.circ.value;
  if(c>0.025 && a>0.008) return "rumination-like looping / groove formation";
  if(n>0.12 && c<0.01) return "wandering / turbulence / switching";
  if(a>0.012 && n<0.08) return "attractor deepening / stabilization";
  if(n<0.03 && c<0.005 && a<0.003) return "direct basin settling";
  return "exploratory drift with partial recurrence";
}
function updateStatus(grad,circX,circY){
  const gradMag=Math.hypot(grad.x,grad.y), circMag=Math.hypot(circX,circY), Hs=pathEntropy();
  els.status.textContent =
`steps: ${steps}
state: (${particle.x.toFixed(3)}, ${particle.y.toFixed(3)})
|∇Φ|: ${gradMag.toFixed(4)}
circulation: ${circMag.toFixed(4)}
path entropy: ${Hs.toFixed(3)}
trail length: ${trajectory.length}`;
  els.regimeBox.textContent = `Preset: ${els.landscapePreset.value}\nLikely pattern: ${regimeGuess()}`;
}
function animate(){ if(!paused) step(); draw(); requestAnimationFrame(animate); }

Object.entries(valueLabels).forEach(([k, el]) => {
  const slider=els[k];
  const refresh=()=> el.textContent = slider.value;
  slider.addEventListener("input", refresh); refresh();
});
els.resetBtn.addEventListener("click", reset);
els.seedBtn.addEventListener("click", ()=>{ particle=randomStart(); prevParticle={...particle}; trajectory=[]; });
els.pauseBtn.addEventListener("click", ()=> paused=!paused);
els.landscapePreset.addEventListener("change", reset);

reset(); animate();
})();
</script>
</body>
</html>
