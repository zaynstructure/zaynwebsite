<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>EVF-2.3 · Canonical PDE Demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  html,body {
    margin:0; padding:0;
    height:100%;
    background:#000;
    color:#fff;
    font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
  }

  #container { display:flex; flex-direction:column; height:100%; }

  #gl-wrap {
    flex:1 1 auto;
    position:relative;
    min-height:50vh;
  }

  canvas { width:100%; height:100%; display:block; }

  #evf-coherence {
    position:absolute; top:8px; right:8px;
    background:rgba(0,0,0,0.6);
    padding:2px 6px;
    font-size:11px;
    border-radius:3px;
    pointer-events:none;
  }

  #evf-ui {
    flex:0 0 auto;
    max-height:42vh;
    overflow-y:auto;
    background:rgba(15,15,20,0.96);
    padding:12px;
    border-top:1px solid #333;
  }
</style>
</head>

<body>
<div id="container">

  <div id="gl-wrap">
    <canvas id="glcanvas"></canvas>
    <div id="evf-coherence">Cₛ ≈ 1.00</div>
  </div>

  <div id="evf-ui">
    <button id="evf-reset" style="width:90px;height:30px;">Reset</button>
    <label style="display:block;margin-top:8px;">
      <input type="checkbox" id="diag-grad"> Structure Map
    </label>
    <!-- All your sliders remain unchanged -->
    <!-- The JavaScript will attach everything -->
  </div>

</div>

<script>
// ------------------------------------------------------------
// LOAD EXTERNAL SHADER (GLSL FILE)
// ------------------------------------------------------------
async function loadText(url) {
  const res = await fetch(url);
  return await res.text();
}

window.addEventListener("load", async () => {

  // ---- Load external render shader ----
  const RENDER_FS = await loadText("./evf-render.glsl");

  // ---- SIM shader inline (unchanged from your current build) ----
  const SIM_FS = `
precision highp float;
varying vec2 vUV;

uniform sampler2D uField;

uniform float uDT;
uniform float uGamma;
uniform float uKappa;
uniform float uSigma;
uniform vec2  uG;
uniform float uAlphaG;

uniform float uLambda;
uniform float uUstar;
uniform vec2  uBasinCenter;
uniform float uBasinRadius;

uniform float uRho;
uniform float uOmega;
uniform float uTime;

uniform float uFrame;
uniform vec2  uTexel;

float fastTanh(float v){
    float e2x = exp(2.0*v);
    return (e2x - 1.0)/(e2x + 1.0);
}

float hash13(vec3 p) {
    p = fract(p * 0.1031);
    p += dot(p, p.yzx + 33.33);
    return fract((p.x + p.y) * p.z);
}

void main() {
    float vC = texture2D(uField, vUV).r;
    float uC = (vC - 0.5) * 2.0;

    float uL = (texture2D(uField, vUV + vec2(-uTexel.x,0.0)).r - 0.5)*2.0;
    float uR = (texture2D(uField, vUV + vec2( uTexel.x,0.0)).r - 0.5)*2.0;
    float uD = (texture2D(uField, vUV + vec2(0.0,-uTexel.y)).r - 0.5)*2.0;
    float uU = (texture2D(uField, vUV + vec2(0.0, uTexel.y)).r - 0.5)*2.0;

    float lap = (uL + uR + uU + uD - 4.0*uC);

    float du_dx = 0.5*(uR - uL);
    float du_dy = 0.5*(uU - uD);
    float adv   = uG.x*du_dx + uG.y*du_dy;

    vec2 d = vUV - uBasinCenter;
    float w  = exp(-dot(d,d)/(2.0*uBasinRadius*uBasinRadius));

    float attract = -uLambda * w * fastTanh(uC - uUstar);

    float damp   = -uGamma * uC;
    float rhythm = uRho * sin(uOmega*uTime) * exp(-2.0 * abs(uC));

    float rhs =
          damp
        + uKappa*lap
        + uAlphaG*adv
        + attract
        + rhythm;

    float eta       = hash13(vec3(gl_FragCoord.xy, uFrame))*2.0 - 1.0;
    float noiseTerm = uSigma * sqrt(max(uDT, 0.0)) * eta;

    float uNext = uC + uDT*rhs + noiseTerm;
    uNext = clamp(uNext, -1.0, 1.0);

    float vNext = 0.5 + 0.5*uNext;
    gl_FragColor = vec4(vNext,0.0,0.0,1.0);
}
`;

  // ---- VERTEX shader (unchanged) ----
  const VS = `
attribute vec2 aPos;
varying vec2 vUV;
void main(){
  vUV = (aPos + 1.0)*0.5;
  gl_Position = vec4(aPos,0.0,1.0);
}`;

  // Now load everything else from your existing JS code...
  // (I can produce a fully cleaned version if you want)
});
</script>

</body>
</html>
