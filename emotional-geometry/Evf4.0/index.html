<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>EVF-M minimal (Three.js) + noise ξ</title>
  <style>
    html,body { margin:0; height:100%; background:#0b0c10; overflow:hidden; }
    canvas { display:block; }
  </style>
</head>
<body>
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js";
import GUI from "https://cdn.jsdelivr.net/npm/lil-gui@0.19/+esm";

// --- renderer ---
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// --- scene + camera ---
const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

// --- EVF-T: fullscreen field ---
const fieldMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime:   { value: 0 },
    uRes:    { value: new THREE.Vector2(innerWidth, innerHeight) },
    uXi:     { value: 0.35 }, // noise
    uGamma:  { value: 0.6 },  // damping
    uA:      { value: 0.7 },  // attractor depth
    uR:      { value: 0.5 }   // rhythm
  },
  vertexShader: `
    varying vec2 vUv;
    void main(){
      vUv = uv;
      gl_Position = vec4(position.xy, 0.0, 1.0);
    }
  `,
  fragmentShader: `
    precision highp float;
    varying vec2 vUv;
    uniform float uTime;
    uniform vec2 uRes;
    uniform float uXi;
    uniform float uGamma;
    uniform float uA;
    uniform float uR;

    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
    float noise(vec2 p){
      vec2 i = floor(p), f = fract(p);
      float a = hash(i);
      float b = hash(i+vec2(1,0));
      float c = hash(i+vec2(0,1));
      float d = hash(i+vec2(1,1));
      vec2 u = f*f*(3.0-2.0*f);
      return mix(a,b,u.x) + (c-a)*u.y*(1.0-u.x) + (d-b)*u.x*u.y;
    }

    float ridged(float n){
      n = abs(n * 2.0 - 1.0);
      return 1.0 - n;
    }

    void main(){
      vec2 uv = vUv;

      // --------- THIS is the "phi computation block" ----------
      vec2 p = uv - 0.5;
      float r = length(p);

      // attractor basin (A)
      float basin = exp(-r*r*(4.0 + 6.0*uA));

      // rhythm rings (R)
      float rings = 0.5 + 0.5*cos((12.0 + 8.0*uR)*r - uTime*(0.4 + 1.2*uR));
      rings *= exp(-r*r*2.0);

      // tension texture (not clouds)
      float n1 = noise(uv * (5.0 + 3.0*uR) + uTime*0.03);
      float tex = ridged(n1);

      // damping (gamma) smooths toward basin
      float smoothTex = mix(tex, basin, uGamma*0.6);

      // film grain (xi)
      float g = (noise(uv*uRes*0.4 + uTime*12.0)-0.5) * (0.10 + 0.35*uXi);

      float phi = 0.55*basin + 0.20*smoothTex + 0.12*rings + g;
      // --------------------------------------------------------

      vec3 col = vec3(phi) * vec3(0.85, 0.92, 1.0);
      gl_FragColor = vec4(col, 1.0);
    }
  `
});

const field = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), fieldMat);
scene.add(field);

// --- GUI (after fieldMat exists) ---
const params = { xi: 0.35, gamma: 0.6, attractor: 0.7, rhythm: 0.5 };
const gui = new GUI({ width: 180 });
gui.title("EVF");
gui.add(params, "xi", 0, 1, 0.01).name("noise ξ")
  .onChange(v => fieldMat.uniforms.uXi.value = v);
gui.add(params, "gamma", 0, 1, 0.01).name("damping γ")
  .onChange(v => fieldMat.uniforms.uGamma.value = v);
gui.add(params, "attractor", 0, 1, 0.01).name("attractor A")
  .onChange(v => fieldMat.uniforms.uA.value = v);
gui.add(params, "rhythm", 0, 1, 0.01).name("rhythm R")
  .onChange(v => fieldMat.uniforms.uR.value = v);

// --- EVF-R graph overlay (your existing code can follow) ---
// (keep your baseNodes/nodes/edges/points/updateEdges/etc here)

// --- resize ---
addEventListener("resize", () => {
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  fieldMat.uniforms.uRes.value.set(innerWidth, innerHeight);
});

// --- animate ---
function animate(t){
  fieldMat.uniforms.uTime.value = t * 0.001;

  // your node jitter / edge updates can run here too

  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);
</script>
</body>
</html>
