<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>EVF-M minimal</title>
  <style>
    html,body { margin:0; height:100%; background:#0b0c10; overflow:hidden; }
    canvas { display:block; }
  </style>
</head>
<body>
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js";
import GUI from "https://cdn.jsdelivr.net/npm/lil-gui@0.19/+esm";

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

 function makeRingTexture(size=128){
  const c = document.createElement("canvas");
  c.width = c.height = size;
  const ctx = c.getContext("2d");

  const rOuter = size*0.48;
  const rInner = size*0.36;
  const cx = size/2;
  const cy = size/2;

  const g = ctx.createRadialGradient(cx,cy,rInner, cx,cy,rOuter);
  g.addColorStop(0.0, "rgba(255,255,255,0.0)");
  g.addColorStop(0.6, "rgba(255,255,255,0.9)");
  g.addColorStop(1.0, "rgba(255,255,255,0.0)");

  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(cx,cy,rOuter,0,Math.PI*2);
  ctx.fill();

  return new THREE.CanvasTexture(c);
} 

// ---------- scene ----------
const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1,1,1,-1,0,1);

const MAX_NODES = 8;
  
// ---------- EVF field shader ----------
const fieldMat = new THREE.ShaderMaterial({
  uniforms:{
  uTime:{value:0},
  uRes:{value:new THREE.Vector2(innerWidth,innerHeight)},
  uXi:{value:0.35},
  uGamma:{value:0.6},
  uA:{value:0.7},
  uR:{value:0.5},
  uRhA:{value:0.18},
  uRhW:{value:1.20},
  uRhMix:{value:0.60},
  uNodeCount:{value:0},
  uNodeGain:  { value: 0.25 },  // strength of injection
  uNodeSigma: { value: 0.18 },  // width in UV space
  uNodes:     { value: Array.from({ length: 8 }, () => new THREE.Vector2()) },
  uNodeStrength: { value: new Float32Array(MAX_NODES) },
},
  vertexShader:`
    varying vec2 vUv;
    void main(){
      vUv=uv;
      gl_Position=vec4(position.xy,0.0,1.0);
    }
  `,
  fragmentShader:`
    precision highp float;
    varying vec2 vUv;
    uniform float uTime;
    uniform vec2 uRes;
    uniform float uXi;
    uniform float uGamma;
    uniform float uA;
    uniform float uR;
    uniform float uRhA;
    uniform float uRhW;
    uniform float uRhMix;
    uniform int   uNodeCount;
uniform float uNodeGain;
uniform float uNodeSigma;
uniform vec2  uNodes[8];
uniform float uNodeStrength[8];

float gauss(vec2 uv, vec2 c, float sigma){
  vec2 d = uv - c;
  float s2 = sigma * sigma + 1e-6;
  return exp(-dot(d,d) / (2.0 * s2));
}

    float hash(vec2 p){
      return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);
    }

    float noise(vec2 p){
      vec2 i=floor(p);
      vec2 f=fract(p);
      float a=hash(i);
      float b=hash(i+vec2(1,0));
      float c=hash(i+vec2(0,1));
      float d=hash(i+vec2(1,1));
      vec2 u=f*f*(3.0-2.0*f);
      return mix(a,b,u.x)+(c-a)*u.y*(1.0-u.x)+(d-b)*u.x*u.y;
    }

    float ridged(float n){
      n=abs(n*2.0-1.0);
      return 1.0-n;
    }

    void main(){
      vec2 uv=vUv;

      // ----- EVF phi computation block -----
      vec2 p=uv-0.5;
      float r=length(p);
      // --- explicit rhythm forcing F(x,t) ---
      float basePhase = uTime * uRhW;
      float F = uRhA * sin(basePhase);

// strongest near center, fades outward
float gate = exp(-r*r*2.0);
float force = F * gate;

      // attractor basin
      float basin=exp(-r*r*(4.0+6.0*uA));

    
      // rhythm rings
      float w = (1.2 + 4.0*uR);                 // speed
      float k = (10.0 + 22.0*uR);               // frequency

// rhythm explicitly phase-shifts rings
      float phaseShift = uRhMix * force * 6.28318; // ~2π scaling
      float rings = 0.5 + 0.5*cos(k*r - uTime*w + phaseShift);
      rings *= exp(-r*r*1.6);

      // tension texture
      float phase = uTime * (0.4 + 2.2*uR);
      float tex = ridged(noise((uv + vec2(cos(phase), sin(phase))*0.08) * (5.0+3.0*uR)));

      // damping
      float smoothTex=mix(tex,basin,uGamma*0.6);

      // grain noise
      float grain=(noise(uv*uRes*0.4+uTime*12.0)-0.5)*(0.10+0.35*uXi);

      float phi=0.55*basin+0.20*smoothTex+0.22*rings+grain;
      float breath = 0.85 + 0.15*sin(uTime*(0.8 + 2.5*uR));
      phi *= breath;
      // forcing also modulates overall field brightness
      phi += (1.0 - uRhMix) * force;
      
      // -------------------------------------
// --- nodes -> field injection ---
float inj = 0.0;
for (int i = 0; i < 8; i++){
  if (i >= uNodeCount) break;
  inj += uNodeStrength[i] * gauss(uv, uNodes[i], uNodeSigma);

}
phi += uNodeGain * inj;
      vec3 col=vec3(phi)*vec3(0.85,0.92,1.0);
      gl_FragColor=vec4(col,1.0);
    }
  `
});

const field=new THREE.Mesh(new THREE.PlaneGeometry(2,2),fieldMat);
scene.add(field);

const params = {
  xi:0.35, gamma:0.6, attractor:0.7, rhythm:0.5, k:0.18, debugNoDamping:false,
  etaBase:0.15, baseSample:0.0,

  rhA:0.18,
  rhW:1.20,
  rhMix:0.60,

  alphaS: 0.10,   // imprint rate
  gammaS: 0.20,   // decay
  bGain:  0.15,   // basin scaling
  bClamp: 1.0,    // cap
};

  let phi0 = 0.0;               // baseline state (you also need this)
const gui = new GUI({ width: 180 });
gui.title("EVF");
  
// ---------- EVF relational graph ----------
const baseNodes = [
  new THREE.Vector3(-0.15, 0.10, 0.01),
  new THREE.Vector3( 0.35,-0.05, 0.01),
  new THREE.Vector3( 0.05,-0.35, 0.01)
];

const nodes = baseNodes.map(v => v.clone());
const S = new Float32Array(nodes.length).fill(0.0);

const edgePairs = [[0,1],[1,2],[2,0]];

// ----- edges -----
const edgePos = new Float32Array(edgePairs.length * 2 * 3);
const edgeGeom = new THREE.BufferGeometry();
edgeGeom.setAttribute("position", new THREE.BufferAttribute(edgePos,3));

const edgeMat = new THREE.LineBasicMaterial({
  color: 0xffffff,
  transparent: true,
  opacity: 0.45
});

const edges = new THREE.LineSegments(edgeGeom, edgeMat);
scene.add(edges);

// ----- node points -----
const ptsGeom = new THREE.BufferGeometry().setFromPoints(nodes);

const ptsMat = new THREE.PointsMaterial({
  color: 0xffffff,
  size: 8,
  sizeAttenuation: false,
  transparent: true,
  opacity: 0.9
});

const points = new THREE.Points(ptsGeom, ptsMat);
scene.add(points);

// ----- basin rings -----
const ringGeom = new THREE.BufferGeometry().setFromPoints(nodes);

const ringMat = new THREE.PointsMaterial({
  map: makeRingTexture(),
  size: 28,
  transparent: true,
  opacity: 0.25,
  depthWrite: false,
  color: 0xffffff,
  alphaTest: 0.01
});

const rings = new THREE.Points(ringGeom, ringMat);
scene.add(rings);

// ----- draw order / depth -----
field.renderOrder  = 0;
edges.renderOrder  = 1;
rings.renderOrder  = 2;
points.renderOrder = 3;

points.material.depthTest = false;
rings.material.depthTest  = false;
edges.material.depthTest  = false;

// ----- edge updater -----
function updateEdges(){
  const pos = edgeGeom.attributes.position.array;
  let k = 0;

  for (const [a,b] of edgePairs){
    const A = nodes[a];
    const B = nodes[b];

    pos[k++] = A.x; pos[k++] = A.y; pos[k++] = A.z;
    pos[k++] = B.x; pos[k++] = B.y; pos[k++] = B.z;
  }

  edgeGeom.attributes.position.needsUpdate = true;
}true;

  
  
// ---------- 
gui.add(params,"xi",0,1,0.01).name("noise ξ")
  .onChange(v=>fieldMat.uniforms.uXi.value=v);

gui.add(params,"gamma",0,1,0.01).name("damping γ")
  .onChange(v=>fieldMat.uniforms.uGamma.value=v);

gui.add(params,"attractor",0,1,0.01).name("attractor A")
  .onChange(v=>fieldMat.uniforms.uA.value=v);

gui.add(params,"rhythm",0,1,0.01).name("rhythm R")
  .onChange(v=>fieldMat.uniforms.uR.value=v);
  
  gui.add(params,"k",0,0.6,0.01).name("coupling k");

  gui.add(params,"rhA",0,1,0.01).name("rhythm amp")
  .onChange(v=>fieldMat.uniforms.uRhA.value=v);

gui.add(params,"rhW",0,6,0.01).name("rhythm ω")
  .onChange(v=>fieldMat.uniforms.uRhW.value=v);

gui.add(params,"rhMix",0,1,0.01).name("rhythm mix")
  .onChange(v=>fieldMat.uniforms.uRhMix.value=v);

  gui.add(fieldMat.uniforms.uNodeGain,  "value", 0.0, 1.0, 0.01).name("node→field gain");
gui.add(fieldMat.uniforms.uNodeSigma, "value", 0.02, 0.5, 0.01).name("node→field sigma");


  

// add to GUI
gui.add(params, "debugNoDamping").name("debug: no damping");
gui.add(params, "etaBase", 0.0, 1.0, 0.01).name("baseline η");
gui.add(params, "baseSample").name("phi0").disable();
// ---------- resize ----------
addEventListener("resize",()=>{
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  fieldMat.uniforms.uRes.value.set(innerWidth,innerHeight);
});

// ---------- animate ----------

  // ---- GUI additions (put after your existing gui.add(params,"k"... ) ) ----
params.motionBoost = 10.0;     // exaggerate k effect on motion (debug)

params.freezeBase  = false;   // if true, disable pull to base (debug)

gui.add(params, "motionBoost", 0.0, 20.0, 0.1).name("debug: motionBoost");
gui.add(params, "freezeBase").name("debug: freeze base");

// ---- helpers ----
function samplePhi_raw(x, y, time){
  const u = x*0.5 + 0.5;
  const v = y*0.5 + 0.5;
  const dx = u - 0.5;
  const dy = v - 0.5;
  const r  = Math.sqrt(dx*dx + dy*dy);

  const basin = Math.exp(-r*r*(4 + 6*params.attractor));
  const speed = 0.8 + 3.5*params.rhythm;
  const kk    = 10 + 22*params.rhythm;
  const rings = 0.5 + 0.5*Math.cos(kk*r - time*speed);

  return 2.2*basin + 1.8*rings;
}

  function meanPhi(time){
  // sample a few fixed points in NDC
  const pts = [
    [-0.5, -0.5], [0.5, -0.5],
    [-0.5,  0.5], [0.5,  0.5],
    [0.0,   0.0]
  ];
  let s = 0;
  for (const [x,y] of pts) s += samplePhi_raw(x,y,time); // raw, NOT baseline-subtracted
  return s / pts.length;
}

function samplePhi(x,y,time){
  return samplePhi_raw(x,y,time) - phi0;
}


function gradientPhi(x, y, time){
  const e  = 0.01; // larger step => stronger, less noisy gradient estimate
  const gx = samplePhi(x + e, y, time) - samplePhi(x - e, y, time);
  const gy = samplePhi(x, y + e, time) - samplePhi(x, y - e, time);
  return { x: gx, y: gy };
}

function animate(t){
  const time = t * 0.001;
  fieldMat.uniforms.uTime.value = time;

  // --- send node positions to shader (NDC -> UV) ---
fieldMat.uniforms.uNodeCount.value = Math.min(nodes.length, MAX_NODES);
for (let i = 0; i < fieldMat.uniforms.uNodeCount.value; i++){
  const u = nodes[i].x * 0.5 + 0.5;
  const v = nodes[i].y * 0.5 + 0.5;
  fieldMat.uniforms.uNodes.value[i].set(u, v);
}

  // IMPORTANT: make k literal (no baseline, no squaring)
  const phase = time * (0.8 + 4.0 * params.rhythm);
const kBreath = 0.65 + 0.35 * Math.sin(phase); // rhythmic renormalization
const k = params.k * kBreath;
  const gamma = (params.debugNoDamping || params.freezeBase) ? 0.0 : params.gamma * 0.05;

  // cosmetic: show coupling intensity
  edges.material.opacity  = 0.10 + 0.90 * (k / 0.6);
  points.material.opacity = 0.25 + 0.75 * (k / 0.6);
  

  const vx = new Array(nodes.length).fill(0);
  const vy = new Array(nodes.length).fill(0);

const dt = 1/60; // or compute from lastTime for accuracy
const m = meanPhi(time);
phi0 += params.etaBase * (m - phi0) * dt;
params.baseSample = phi0;

// --- attachment basin -> per-node injection strength (A) ---
const strengths = fieldMat.uniforms.uNodeStrength.value; // Float32Array
strengths.fill(0);

for (let i = 0; i < nodes.length && i < MAX_NODES; i++){
  const x = nodes[i].x;
  const y = nodes[i].y;

  // use RAW field potential (not baseline-subtracted)
  const phi_i = samplePhi_raw(x, y, time);

  // salience memory update: S_i += dt*(alphaS*phi_i - gammaS*S_i)
  S[i] += dt * (params.alphaS * phi_i - params.gammaS * S[i]);
  if (S[i] < 0) S[i] = 0;

  // coupling coherence (v0) = global k
  const Ci = k;

  // basin B_i = phi_i * S_i * C_i
  const Bi = phi_i * S[i] * Ci;

  // map basin -> strength (clamped)
  strengths[i] = Math.min(params.bClamp, Math.max(0, params.bGain * Bi));
}

  let Bavg = 0;
for(let i=0;i<nodes.length;i++){
  Bavg += strengths[i];
}
Bavg /= nodes.length;

// basin → ring size + opacity
ringMat.opacity = 0.15 + 0.6*Math.min(1,Bavg);
ringMat.size    = 18 + 28*Math.min(1,Bavg);
rings.geometry.setFromPoints(nodes);
points.geometry.setFromPoints(nodes);

  const bx = baseNodes[i].x;
  const by = baseNodes[i].y;


    const g = gradientPhi(x, y, time);

    // motion velocity (proportional to k)
    vx[i] = g.x * k * params.motionBoost;
    vy[i] = g.y * k * params.motionBoost;

    // integrate
    nodes[i].x = x + vx[i];
    nodes[i].y = y + vy[i];

    // pull back toward base (damping)
    nodes[i].x += (bx - nodes[i].x) * gamma;
    nodes[i].y += (by - nodes[i].y) * gamma;
  }
  updateEdges(); // make sure your updateEdges() function exists above
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
// ---- start loop ----
requestAnimationFrame(animate);

</script>
</body>
</html>
