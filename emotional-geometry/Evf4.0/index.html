<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>EVF-M minimal</title>
  <style>
    html,body { margin:0; height:100%; background:#0b0c10; overflow:hidden; }
    canvas { display:block; }
  </style>
</head>
<body>
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js";
import GUI from "https://cdn.jsdelivr.net/npm/lil-gui@0.19/+esm";

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

// ---------- scene ----------
const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1,1,1,-1,0,1);

// ---------- EVF field shader ----------
const fieldMat = new THREE.ShaderMaterial({
  uniforms:{
    uTime:{value:0},
    uRes:{value:new THREE.Vector2(innerWidth,innerHeight)},
    uXi:{value:0.35},
    uGamma:{value:0.6},
    uA:{value:0.7},
    uR:{value:0.5}
  },
  vertexShader:`
    varying vec2 vUv;
    void main(){
      vUv=uv;
      gl_Position=vec4(position.xy,0.0,1.0);
    }
  `,
  fragmentShader:`
    precision highp float;
    varying vec2 vUv;
    uniform float uTime;
    uniform vec2 uRes;
    uniform float uXi;
    uniform float uGamma;
    uniform float uA;
    uniform float uR;

    float hash(vec2 p){
      return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);
    }

    float noise(vec2 p){
      vec2 i=floor(p);
      vec2 f=fract(p);
      float a=hash(i);
      float b=hash(i+vec2(1,0));
      float c=hash(i+vec2(0,1));
      float d=hash(i+vec2(1,1));
      vec2 u=f*f*(3.0-2.0*f);
      return mix(a,b,u.x)+(c-a)*u.y*(1.0-u.x)+(d-b)*u.x*u.y;
    }

    float ridged(float n){
      n=abs(n*2.0-1.0);
      return 1.0-n;
    }

    void main(){
      vec2 uv=vUv;

      // ----- EVF phi computation block -----
      vec2 p=uv-0.5;
      float r=length(p);

      // attractor basin
      float basin=exp(-r*r*(4.0+6.0*uA));

      // rhythm rings
      float w = (1.2 + 4.0*uR);                 // speed
      float k = (10.0 + 22.0*uR);               // frequency
      float rings = 0.5 + 0.5*cos(k*r - uTime*w);
      rings *= exp(-r*r*1.6);

      // tension texture
      float phase = uTime * (0.4 + 2.2*uR);
      float tex = ridged(noise((uv + vec2(cos(phase), sin(phase))*0.08) * (5.0+3.0*uR)));

      // damping
      float smoothTex=mix(tex,basin,uGamma*0.6);

      // grain noise
      float grain=(noise(uv*uRes*0.4+uTime*12.0)-0.5)*(0.10+0.35*uXi);

      float phi=0.55*basin+0.20*smoothTex+0.22*rings+grain;
      float breath = 0.85 + 0.15*sin(uTime*(0.8 + 2.5*uR));
      phi *= breath;
      
      // -------------------------------------

      vec3 col=vec3(phi)*vec3(0.85,0.92,1.0);
      gl_FragColor=vec4(col,1.0);
    }
  `
});

const field=new THREE.Mesh(new THREE.PlaneGeometry(2,2),fieldMat);
scene.add(field);

// ---------- EVF relational graph ----------
const baseNodes=[
  new THREE.Vector3(-0.15,0.10,0.01),
  new THREE.Vector3(0.35,-0.05,0.01),
  new THREE.Vector3(0.05,-0.35,0.01)
];

const nodes=baseNodes.map(v=>v.clone());
const edgePairs=[[0,1],[1,2],[2,0]];

const edgePos=new Float32Array(edgePairs.length*2*3);
const edgeGeom=new THREE.BufferGeometry();
edgeGeom.setAttribute("position",new THREE.BufferAttribute(edgePos,3));

const edgeMat=new THREE.LineBasicMaterial({
  color:0xffffff,
  transparent:true,
  opacity:0.45
});

  const edges = new THREE.LineSegments(edgeGeom, edgeMat);
scene.add(edges);

const ptsGeom=new THREE.BufferGeometry().setFromPoints(nodes);
const ptsMat=new THREE.PointsMaterial({
  color:0xffffff,
  size:6,
  sizeAttenuation:false,
  transparent:true,
  opacity:0.8
});
const points=new THREE.Points(ptsGeom,ptsMat);
scene.add(points);

  // --- debug: velocity arrows (one per node) ---
const arrowGeom = new THREE.BufferGeometry();
const arrowPos = new Float32Array(nodes.length * 2 * 3); // 2 points per arrow, 3 coords
arrowGeom.setAttribute("position", new THREE.BufferAttribute(arrowPos, 3));

const arrowMat = new THREE.LineBasicMaterial({
  color: 0xffffff,
  transparent: true,
  opacity: 0.7
});

const arrows = new THREE.LineSegments(arrowGeom, arrowMat);
scene.add(arrows);

function updateArrows(vxArr, vyArr, scale){
  const pos = arrowGeom.attributes.position.array;
  let k = 0;

  for (let i = 0; i < nodes.length; i++){
    const x = nodes[i].x, y = nodes[i].y, z = nodes[i].z;

    const vx = vxArr[i] * scale;
    const vy = vyArr[i] * scale;

    // start
    pos[k++] = x;      pos[k++] = y;      pos[k++] = z;
    // end
    pos[k++] = x + vx; pos[k++] = y + vy; pos[k++] = z;
  }

  arrowGeom.attributes.position.needsUpdate = true;
}

// ---------- GUI ----------
const params={xi:0.35,gamma:0.6,attractor:0.7,rhythm:0.5,k:0.18,debugNoDamping:false};
const gui=new GUI({width:180});
gui.title("EVF");

gui.add(params,"xi",0,1,0.01).name("noise ξ")
  .onChange(v=>fieldMat.uniforms.uXi.value=v);

gui.add(params,"gamma",0,1,0.01).name("damping γ")
  .onChange(v=>fieldMat.uniforms.uGamma.value=v);

gui.add(params,"attractor",0,1,0.01).name("attractor A")
  .onChange(v=>fieldMat.uniforms.uA.value=v);

gui.add(params,"rhythm",0,1,0.01).name("rhythm R")
  .onChange(v=>fieldMat.uniforms.uR.value=v);
  
  gui.add(params,"k",0,0.6,0.01).name("coupling k");


// add to GUI
gui.add(params, "debugNoDamping").name("debug: no damping");

// ---------- resize ----------
addEventListener("resize",()=>{
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  fieldMat.uniforms.uRes.value.set(innerWidth,innerHeight);
});

// ---------- animate ----------

  function samplePhi(x, y, time){
  const u = x*0.5 + 0.5;
  const v = y*0.5 + 0.5;

  const dx = u - 0.5;
  const dy = v - 0.5;
  const r = Math.sqrt(dx*dx + dy*dy);

  const basin = Math.exp(-r*r*(4 + 6*params.attractor));

  const speed = 0.8 + 3.5*params.rhythm;
  const k = 10 + 22*params.rhythm;
  const rings = 0.5 + 0.5*Math.cos(k*r - time*speed);

  return 2.0*basin + 1.6*rings;
}

function gradientPhi(x, y, time){
  const e = 0.006;
  const gx = samplePhi(x + e, y, time) - samplePhi(x - e, y, time);
  const gy = samplePhi(x, y + e, time) - samplePhi(x, y - e, time);
  return { x: gx, y: gy };
}

function animate(t){
  const time = t * 0.001;
  fieldMat.uniforms.uTime.value = time;

  const phase = time * (0.8 + 4.0 * params.rhythm);

  const k0 = params.k * params.k;
  const k  = (0.02 + 0.6 * k0);   // ← pure coupling (clearer)
  const gamma = (params.debugNoDamping ? 0.0 : params.gamma * 0.05);

  const vx = new Array(nodes.length).fill(0);
const vy = new Array(nodes.length).fill(0);

  edges.material.opacity  = 0.15 + 0.85 * Math.min(1, params.k / 0.6);
  points.material.opacity = 0.30 + 0.70 * Math.min(1, params.k / 0.6);

  for (let i = 0; i < nodes.length; i++){
    const x = nodes[i].x;
    const y = nodes[i].y;

    const bx = baseNodes[i].x;
    const by = baseNodes[i].y;

    const g = gradientPhi(x, y, time);

    vx[i] = g.x * k;
vy[i] = g.y * k;

nodes[i].x = x + vx[i];
nodes[i].y = y + vy[i];

    nodes[i].x += (bx - nodes[i].x) * gamma;
    nodes[i].y += (by - nodes[i].y) * gamma;
  }
  
  updateArrows(vx, vy, 45.0);
  
  ptsGeom.setFromPoints(nodes);
  ptsGeom.attributes.position.needsUpdate = true;
  updateEdges();

  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

// ---- start loop ----
requestAnimationFrame(animate);

</script>
</body>
</html>
