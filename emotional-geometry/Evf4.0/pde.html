import GUI from "https://cdn.jsdelivr.net/npm/lil-gui@0.19/+esm";

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

function makeRingTexture(size=128){
  const c = document.createElement("canvas");
  c.width = c.height = size;
  const ctx = c.getContext("2d");

  const rOuter = size*0.48;
  const rInner = size*0.36;
  const cx = size/2;
  const cy = size/2;

  const g = ctx.createRadialGradient(cx,cy,rInner, cx,cy,rOuter);
  g.addColorStop(0.0, "rgba(255,255,255,0.0)");
  g.addColorStop(0.6, "rgba(255,255,255,0.9)");
  g.addColorStop(1.0, "rgba(255,255,255,0.0)");

  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(cx,cy,rOuter,0,Math.PI*2);
  ctx.fill();

  const tex = new THREE.CanvasTexture(c);
  tex.needsUpdate = true;
  return tex;
}

// ---------- scene ----------
const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1,1,1,-1,0,1);

const MAX_NODES = 8;

// ===================== PDE FIELD (ping-pong) =====================
const simRes = 512; // 256 (fast), 512 (good), 1024 (heavy)
const rtOpts = {
  minFilter: THREE.LinearFilter,
  magFilter: THREE.LinearFilter,
  format: THREE.RGBAFormat,
  type: THREE.FloatType,          // requires OES_texture_float / WebGL2 float support
  depthBuffer: false,
  stencilBuffer: false
};

const rtA = new THREE.WebGLRenderTarget(simRes, simRes, rtOpts);
const rtB = new THREE.WebGLRenderTarget(simRes, simRes, rtOpts);

let rtRead = rtA;
let rtWrite = rtB;

// init texture (optional): clear to 0.5 baseline gray
renderer.setRenderTarget(rtRead);
renderer.clearColor();
renderer.clear();
renderer.setRenderTarget(null);

// sim scene
const simScene = new THREE.Scene();
const simCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

// uniforms for simulation step
const simUniforms = {
  uPrev: { value: rtRead.texture },
  uDt:   { value: 1 / 60 },
  uKappa:{ value: 0.08 },   // diffusion κ
  uGamma:{ value: 0.35 },   // damping γ
  uPhi0: { value: 0.0 },    // baseline φ0 (can be 0)
  uNodeCount:    { value: 0 },
  uNodes:        { value: Array.from({ length: 8 }, () => new THREE.Vector2()) },
  uNodeStrength: { value: new Float32Array(8) },
  uNodeSigma:    { value: 0.06 },  // in UV space
  uNodeGain:     { value: 0.8 }    // injection gain
};

const simMat = new THREE.ShaderMaterial({
  uniforms: simUniforms,
  vertexShader: `
    varying vec2 vUv;
    void main(){
      vUv = uv;
      gl_Position = vec4(position.xy, 0.0, 1.0);
    }
  `,
  fragmentShader: `
    precision highp float;
    varying vec2 vUv;

    uniform sampler2D uPrev;
    uniform float uDt;
    uniform float uKappa;
    uniform float uGamma;
    uniform float uPhi0;

    uniform int   uNodeCount;
    uniform vec2  uNodes[8];
    uniform float uNodeStrength[8];
    uniform float uNodeSigma;
    uniform float uNodeGain;

    float gauss(vec2 uv, vec2 c, float sigma){
      vec2 d = uv - c;
      float s2 = sigma*sigma + 1e-6;
      return exp(-dot(d,d) / (2.0*s2));
    }

    void main(){
      // read previous φ from red channel
      float phi = texture2D(uPrev, vUv).r;

      // Laplacian (5-point stencil)
      vec2 texel = vec2(1.0) / vec2(textureSize(uPrev, 0));
      float up    = texture2D(uPrev, vUv + vec2(0.0, texel.y)).r;
      float down  = texture2D(uPrev, vUv - vec2(0.0, texel.y)).r;
      float left  = texture2D(uPrev, vUv - vec2(texel.x, 0.0)).r;
      float right = texture2D(uPrev, vUv + vec2(texel.x, 0.0)).r;
      float lap = (up + down + left + right - 4.0 * phi);

      // node injection
      float inj = 0.0;
      for (int i=0; i<8; i++){
        if (i >= uNodeCount) break;
        inj += uNodeStrength[i] * gauss(vUv, uNodes[i], uNodeSigma);
      }
      inj *= uNodeGain;

      // PDE step
      float dphi = (uKappa * lap) - (uGamma * (phi - uPhi0)) + inj;
      float phiN = phi + uDt * dphi;

      // clamp to avoid blowups (optional)
      phiN = clamp(phiN, -2.0, 2.0);

      gl_FragColor = vec4(phiN, 0.0, 0.0, 1.0);
    }
  `
});

const simQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), simMat);
simScene.add(simQuad);

// display material: show the simulated φ texture

fieldMat.fragmentShader = fieldMat.fragmentShader.replace(
  "vec2 uv=vUv;",
  `
  vec2 uv=vUv;
  // sampled PDE field
  float phiPDE = texture2D(uFieldTex, uv).r;
  `
).replace(
  "float phi=0.55*basin+0.20*smoothTex+0.22*rings+grain;",
  `
  // mix PDE with your aesthetic field (tune blend)
  float phi = mix(0.55*basin+0.20*smoothTex+0.22*rings+grain, phiPDE, 0.85);

);

// ---------- EVF field shader ----------
const fieldMat = new THREE.ShaderMaterial({
  uniforms:{
    uTime:{value:0},
    uRes:{value:new THREE.Vector2(innerWidth,innerHeight)},
    uXi:{value:0.35},
    uGamma:{value:0.6},

    uRhW:{value:1.20},

    uFieldTex: { value: null },     // <-- PDE texture goes here
    uPdeMix:   { value: 0.85 },     // <-- blend amount

    uNodeCount:{value:0},
    uNodeGain:  { value: 0.25 },
    uNodeSigma: { value: 0.18 },
    uNodes:     { value: Array.from({ length: 8 }, () => new THREE.Vector2()) },
    uNodeStrength: { value: new Float32Array(MAX_NODES) },
  },
  vertexShader:`
    varying vec2 vUv;
    void main(){
      vUv = uv;
      gl_Position = vec4(position.xy,0.0,1.0);
    }
  `,
  fragmentShader:`
    precision highp float;
    varying vec2 vUv;

    uniform float uTime;
    uniform vec2  uRes;
    uniform float uXi;
    uniform float uGamma;
    uniform float uA;
    uniform float uR;
    uniform float uRhA;
    uniform float uRhW;
    uniform float uRhMix;

    uniform sampler2D uFieldTex;
    uniform float uPdeMix;

    uniform int   uNodeCount;
    uniform float uNodeGain;
    uniform float uNodeSigma;
    uniform vec2  uNodes[8];
    uniform float uNodeStrength[8];

    float gauss(vec2 uv, vec2 c, float sigma){
      vec2 d = uv - c;
      float s2 = sigma*sigma + 1e-6;
      return exp(-dot(d,d) / (2.0*s2));
    }

    float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
    float noise(vec2 p){
      vec2 i=floor(p), f=fract(p);
      float a=hash(i), b=hash(i+vec2(1,0)), c=hash(i+vec2(0,1)), d=hash(i+vec2(1,1));
      vec2 u=f*f*(3.0-2.0*f);
      return mix(a,b,u.x)+(c-a)*u.y*(1.0-u.x)+(d-b)*u.x*u.y;
    }
    float ridged(float n){ n=abs(n*2.0-1.0); return 1.0-n; }

    void main(){
      vec2 uv = vUv;

      // --- analytic field (your original aesthetic) ---
      vec2 p = uv - 0.5;
      float r = length(p);

      float basePhase = uTime * uRhW;
      float F = uRhA * sin(basePhase);

      float gate  = exp(-r*r*2.0);
      float force = F * gate;

      float basin = exp(-r*r*(4.0+6.0*uA));

      float w = (1.2 + 4.0*uR);
      float k = (10.0 + 22.0*uR);

      float phaseShift = uRhMix * force * 6.28318;
      float rings = 0.5 + 0.5*cos(k*r - uTime*w + phaseShift);
      rings *= exp(-r*r*1.6);

      float phase = uTime * (0.4 + 2.2*uR);
      float tex = ridged(noise((uv + vec2(cos(phase), sin(phase))*0.08) * (5.0+3.0*uR)));

      float smoothTex = mix(tex, basin, uGamma*0.6);
      float grain = (noise(uv*uRes*0.4 + uTime*12.0)-0.5) * (0.10 + 0.35*uXi);

      float phiA = 0.55*basin + 0.20*smoothTex + 0.22*rings + grain;
      float breath = 0.85 + 0.15*sin(uTime*(0.8 + 2.5*uR));
      phiA *= breath;
      phiA += (1.0 - uRhMix) * force;

      // nodes -> analytic injection (kept)
      float injA = 0.0;
      for(int i=0;i<8;i++){
        if(i>=uNodeCount) break;
        injA += uNodeStrength[i] * gauss(uv, uNodes[i], uNodeSigma);
      }
      phiA += uNodeGain * injA;

      // --- PDE field sample ---
      float phiP = 0.0;
      if (uFieldTex != sampler2D(0)) { // harmless guard; three will bind anyway
        phiP = texture2D(uFieldTex, uv).r;
      }

      // blend
      float phi = mix(phiA, phiP, uPdeMix);

      vec3 col = vec3(phi) * vec3(0.85,0.92,1.0);
      gl_FragColor = vec4(col,1.0);
    }
  `
});
  const field = new THREE.Mesh(new THREE.PlaneGeometry(2,2), fieldMat);
scene.add(field);

simScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), simMat));

// feed field display

// ================================================================

// ---------- params + gui ----------
const params = {
  xi:0.35, gamma:0.6, attractor:0.7, rhythm:0.5, k:0.18,
  debugNoDamping:false,
  etaBase:0.15, baseSample:0.0,
  rhA:0.18, rhW:1.20, rhMix:0.60,

};

let phi0 = 0.0;

// ---------- EVF relational graph ----------
const baseNodes = [

  new THREE.Vector3( 0.35,-0.05, 0.01),
  new THREE.Vector3( 0.05,-0.35, 0.01)
];

const nodes = baseNodes.map(v => v.clone());
const S = new Float32Array(nodes.length).fill(0.0);
const edgePairs = [[0,1],[1,2],[2,0]];

// edges
const edgePos  = new Float32Array(edgePairs.length * 2 * 3);
const edgeGeom = new THREE.BufferGeometry();
edgeGeom.setAttribute("position", new THREE.BufferAttribute(edgePos,3));

const edgeMat = new THREE.LineBasicMaterial({

});

scene.add(edges);

// points

const ptsMat  = new THREE.PointsMaterial({
  color:0xffffff,
  size:8,

});
const points = new THREE.Points(ptsGeom, ptsMat);
// --- SHARP node dots ---
ptsMat.size = 10;                 // bigger = easier to see
ptsMat.opacity = 1.0;             // fully opaque
ptsMat.transparent = false;       // avoids soft blending from alpha
ptsMat.depthWrite = false;        // don't punch holes in other layers

ptsMat.blending = THREE.NoBlending; // crisp (no additive glow)
  
scene.add(points);

// rings
const ringGeom = new THREE.BufferGeometry().setFromPoints(nodes);
const ringMat  = new THREE.PointsMaterial({
  map: makeRingTexture(),
  size: 28,
  transparent: true,
  opacity: 0.25,
  depthWrite: false,
  color: 0xffffff,

});

scene.add(rings);

// draw order / depth
field.renderOrder  = 0;
edges.renderOrder  = 1;
rings.renderOrder  = 2;
points.renderOrder = 3;

points.material.depthTest = false;
rings.material.depthTest  = false;
edges.material.depthTest  = false;

function updateEdges(){
  const pos = edgeGeom.attributes.position.array;
  let k = 0;
  for (const [a,b] of edgePairs){
    const A = nodes[a];
    const B = nodes[b];
    pos[k++] = A.x; pos[k++] = A.y; pos[k++] = A.z;
    pos[k++] = B.x; pos[k++] = B.y; pos[k++] = B.z;
  }
  edgeGeom.attributes.position.needsUpdate = true;
}

// ---------- helpers ----------
function samplePhi_raw(x, y, time){
  const u = x*0.5 + 0.5;
  const v = y*0.5 + 0.5;
  const dx = u - 0.5;
  const dy = v - 0.5;
  const r  = Math.sqrt(dx*dx + dy*dy);

  const basin = Math.exp(-r*r*(4 + 6*params.attractor));
  const speed = 0.8 + 3.5*params.rhythm;
  const kk    = 10 + 22*params.rhythm;
  const rings = 0.5 + 0.5*Math.cos(kk*r - time*speed);

  return 2.2*basin + 1.8*rings;
}

function meanPhi(time){
  const pts = [[-0.5,-0.5],[0.5,-0.5],[-0.5,0.5],[0.5,0.5],[0.0,0.0]];
  let s = 0;
  for (const [x,y] of pts) s += samplePhi_raw(x,y,time);
  return s / pts.length;
}

function samplePhi(x,y,time){
  return samplePhi_raw(x,y,time) - phi0;
}

function gradientPhi(x, y, time){
  const e  = 0.01;
  const gx = samplePhi(x + e, y, time) - samplePhi(x - e, y, time);
  const gy = samplePhi(x, y + e, time) - samplePhi(x, y - e, time);
  return { x: gx, y: gy };
}

// ---------- animate ----------
function animate(t){
  const time = t * 0.001;
  fieldMat.uniforms.uTime.value = time;

  // send node positions to shader (NDC -> UV)
  fieldMat.uniforms.uNodeCount.value = Math.min(nodes.length, MAX_NODES);
  for (let i = 0; i < fieldMat.uniforms.uNodeCount.value; i++){
    const u = nodes[i].x * 0.5 + 0.5;
    const v = nodes[i].y * 0.5 + 0.5;
    fieldMat.uniforms.uNodes.value[i].set(u, v);
  }

  // k breath + damping
  const phase = time * (0.8 + 4.0 * params.rhythm);
  const kBreath = 0.65 + 0.35 * Math.sin(phase);
  const k = params.k * kBreath;

  const gamma = (params.debugNoDamping || params.freezeBase) ? 0.0 : params.gamma * 0.05;

  edges.material.opacity  = 0.10 + 0.90 * (k / 0.6);
  points.material.opacity = 0.25 + 0.75 * (k / 0.6);

  const dt = 1/60;
  const m = meanPhi(time);
  phi0 += params.etaBase * (m - phi0) * dt;
  params.baseSample = phi0;

  // basin -> per-node strength
  const strengths = fieldMat.uniforms.uNodeStrength.value;
  strengths.fill(0);

  for (let i = 0; i < nodes.length && i < MAX_NODES; i++){
    const x = nodes[i].x;
    const y = nodes[i].y;

    const phi_i = samplePhi_raw(x, y, time);

    S[i] += dt * (params.alphaS * phi_i - params.gammaS * S[i]);
    if (S[i] < 0) S[i] = 0;

    const Ci = k;
    const Bi = phi_i * S[i] * Ci;

    strengths[i] = Math.min(params.bClamp, Math.max(0, params.bGain * Bi));
  }

  // ring sizing (avg)
  let Bavg = 0;
  for(let i=0;i<nodes.length;i++) Bavg += strengths[i];
  Bavg /= nodes.length;

  ringMat.opacity = 0.15 + 0.6*Math.min(1,Bavg);
  ringMat.size    = 18 + 28*Math.min(1,Bavg);

    const y  = nodes[i].y;
    const bx = baseNodes[i].x;
    const by = baseNodes[i].y;

    const g = gradientPhi(x, y, time);

    nodes[i].x = x + g.x * k * params.motionBoost;
    nodes[i].y = y + g.y * k * params.motionBoost;

    nodes[i].x += (bx - nodes[i].x) * gamma;
    nodes[i].y += (by - nodes[i].y) * gamma;
  }

  // update overlay geometries AFTER nodes move
  rings.geometry.setFromPoints(nodes);
  points.geometry.setFromPoints(nodes);
  updateEdges();

// push nodes into sim shader (UV space)
simUniforms.uNodeCount.value = Math.min(nodes.length, 8);
for (let i = 0; i < simUniforms.uNodeCount.value; i++){

fieldMat.uniforms.uFieldTex.value = rtRead.texture;

// ================================
// ======== SIM STEP (PDE) ========
simUniforms.uNodeCount.value = Math.min(nodes.length, 8);
for (let i = 0; i < simUniforms.uNodeCount.value; i++){
  const u = nodes[i].x * 0.5 + 0.5;
  const v = nodes[i].y * 0.5 + 0.5;
  simUniforms.uNodes.value[i].set(u, v);
  simUniforms.uNodeStrength.value[i] = fieldMat.uniforms.uNodeStrength.value[i];
}
simUniforms.uDt.value = 1/60;

simUniforms.uPrev.value = rtRead.texture;
renderer.setRenderTarget(rtWrite);
renderer.render(simScene, simCam);
renderer.setRenderTarget(null);

// swap
{ const tmp = rtRead; rtRead = rtWrite; rtWrite = tmp; }

fieldMat.uniforms.uFieldTex.value = rtRead.texture;
// ===============================
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);
