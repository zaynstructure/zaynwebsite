<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>EVF Field Viewer</title>

<style>
body {
    background:#111;
    color:white;
    font-family:sans-serif;
    text-align:center;
}

canvas{
    border:1px solid #333;
    margin-top:10px;
}
</style>

</head>

<body>

<h2>EVF Meaning Field</h2>

<canvas id="canvas" width="600" height="600"></canvas>

<br><br>

Noise
<input id="noise" type="range" min="0" max="0.3" step="0.01" value="0.08">

Drift
<input id="drift" type="range" min="0" max="2" step="0.01" value="1">

<button onclick="reset()">Reset</button>

<script>

const canvas = document.getElementById("canvas")
const ctx = canvas.getContext("2d")

let particle = {x:0.2,y:1.2}

let trajectory = []

let scale = 120

function potential(x,y){

    let basin1 = -2*Math.exp(-((x+0.9)**2+(y+0.3)**2)/0.3)
    let basin2 = -1.8*Math.exp(-((x-0.8)**2+(y-0.6)**2)/0.25)
    let ridge  =  0.9*Math.exp(-((x-0.1)**2+(y+0.2)**2)/0.15)

    return 0.35*(x*x+y*y)+basin1+basin2+ridge
}

function gradient(x,y){

    let eps = 0.01

    let dx = (potential(x+eps,y)-potential(x-eps,y))/(2*eps)
    let dy = (potential(x,y+eps)-potential(x,y-eps))/(2*eps)

    return {x:dx,y:dy}
}

function drawField(){

    let step = 4

    for(let i=0;i<canvas.width;i+=step){

        for(let j=0;j<canvas.height;j+=step){

            let x = (i-canvas.width/2)/scale
            let y = (j-canvas.height/2)/scale

            let p = potential(x,y)

            let c = Math.floor(120 + p*50)

            ctx.fillStyle = `rgb(${c},${c},${180})`
            ctx.fillRect(i,j,step,step)

        }

    }

}

function drawTrajectory(){

    ctx.strokeStyle="white"
    ctx.beginPath()

    for(let i=0;i<trajectory.length;i++){

        let px = canvas.width/2 + trajectory[i].x*scale
        let py = canvas.height/2 + trajectory[i].y*scale

        if(i===0) ctx.moveTo(px,py)
        else ctx.lineTo(px,py)

    }

    ctx.stroke()

}

function drawParticle(){

    let px = canvas.width/2 + particle.x*scale
    let py = canvas.height/2 + particle.y*scale

    ctx.fillStyle="red"
    ctx.beginPath()
    ctx.arc(px,py,5,0,Math.PI*2)
    ctx.fill()

}

function step(){

    let g = gradient(particle.x,particle.y)

    let noise = parseFloat(noiseSlider.value)
    let drift = parseFloat(driftSlider.value)

    particle.x += (-g.x*drift + noise*(Math.random()-0.5))
    particle.y += (-g.y*drift + noise*(Math.random()-0.5))

    trajectory.push({x:particle.x,y:particle.y})

    if(trajectory.length>2000) trajectory.shift()

}

function animate(){

    ctx.clearRect(0,0,canvas.width,canvas.height)

    drawField()

    step()

    drawTrajectory()

    drawParticle()

    requestAnimationFrame(animate)

}

function reset(){

    particle={x:0.2,y:1.2}
    trajectory=[]

}

const noiseSlider=document.getElementById("noise")
const driftSlider=document.getElementById("drift")

animate()

</script>

</body>
</html>
