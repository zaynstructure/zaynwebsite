<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>EVF-2.3 · Research Mode (R1)</title>

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="container">
  <div id="gl-wrap">
    <canvas id="glcanvas"></canvas>
  </div>

  <div id="sidebar">
    <div class="section">
      <button id="btn-reset">Reset</button>
      <button id="btn-pause">Pause</button>
      <div id="status">dt ≈ …</div>
      <div id="cs-label">Cₛ ≈ …</div>
    </div>

    <div class="section">
      <div class="section-title">Field</div>
      <label>Diffusion κ <input id="p-kappa" type="range" min="0" max="1" step="0.01" value="0.25"></label>
      <label>Damping γ <input id="p-gamma" type="range" min="0.1" max="3" step="0.01" value="0.8"></label>
      <label>Attractor λ <input id="p-lambda" type="range" min="0" max="2" step="0.01" value="0.7"></label>
      <label>Baseline u* <input id="p-ustar" type="range" min="-1" max="1" step="0.01" value="0"></label>
      <label>Basin Radius R <input id="p-basinR" type="range" min="0.03" max="0.4" step="0.005" value="0.12"></label>
      <label>Rhythm ρ <input id="p-rho" type="range" min="0" max="1" step="0.01" value="0.3"></label>
      <label>Frequency ω <input id="p-omega" type="range" min="0.1" max="3" step="0.01" value="0.8"></label>
    </div>

    <div class="section">
      <div class="section-title">Drift</div>
      <label>β <input id="p-beta" type="range" min="0" max="3" step="0.01" value="0.8"></label>
      <label>η <input id="p-eta" type="range" min="0" max="3" step="0.01" value="1.0"></label>
      <label>χ <input id="p-chi" type="range" min="0" max="3" step="0.01" value="1.0"></label>
      <label>δ <input id="p-delta" type="range" min="0" max="3" step="0.01" value="0.5"></label>
      <label>Bx <input id="p-bx" type="range" min="-1" max="1" step="0.01" value="0.3"></label>
      <label>By <input id="p-by" type="range" min="-1" max="1" step="0.01" value="0"></label>
      <label>Cx <input id="p-cx" type="range" min="-1" max="1" step="0.01" value="0"></label>
      <label>Cy <input id="p-cy" type="range" min="-1" max="1" step="0.01" value="0"></label>
    </div>

    <div class="section">
      <div class="section-title">Noise</div>
      <label>σ₀ target <input id="p-sigma0" type="range" min="0" max="0.5" step="0.01" value="0.05"></label>
      <label>σₑ target <input id="p-sigmaE" type="range" min="0" max="1" step="0.01" value="0.15"></label>
    </div>
  </div>
</div>

<!-- =======================================================
     INLINE SHADERS
======================================================= -->

<!-- Vertex shader -->
<script id="vs-quad" type="x-shader/x-vertex">
precision highp float;

attribute vec2 aPos;
varying highp vec2 vUV;

void main(){
  vUV = (aPos + 1.0) * 0.5;
  gl_Position = vec4(aPos, 0.0, 1.0);
}
</script>

<!-- Field PDE shader -->
<script id="fs-field" type="x-shader/x-fragment">
precision highp float;
precision mediump sampler2D;

varying highp vec2 vUV;

uniform sampler2D uField;
uniform sampler2D uDrift;

uniform float uDT;
uniform float uGamma;
uniform float uKappa;
uniform float uLambda;
uniform float uUstar;
uniform float uSigmaTotal;
uniform float uRho;
uniform float uOmega;
uniform float uTime;
uniform float uAlphaG;
uniform float uFrame;
uniform vec2  uBasinCenter;
uniform float uBasinRadius;
uniform vec2  uTexel;

float fastTanh(float x){
  float e2 = exp(2.0 * x);
  return (e2 - 1.0) / (e2 + 1.0);
}

float hash13(vec3 p){
  p = fract(p * 0.1031);
  p += dot(p, p.yzx + 33.33);
  return fract((p.x + p.y) * p.z);
}

float fetchU(vec2 uv){
  uv = clamp(uv, 0.001, 0.999);
  float v = texture2D(uField, uv).r;
  return (v - 0.5) * 2.0;
}

float basinWeight(vec2 uv, vec2 c, float R){
  vec2 d = uv - c;
  return exp(-dot(d, d) / (2.0 * R * R));
}

void main(){
  float uC = fetchU(vUV);
  float uL = fetchU(vUV + vec2(-uTexel.x, 0.0));
  float uR = fetchU(vUV + vec2( uTexel.x, 0.0));
  float uD = fetchU(vUV + vec2(0.0, -uTexel.y));
  float uU = fetchU(vUV + vec2(0.0,  uTexel.y));

  float lap = uL + uR + uD + uU - 4.0 * uC;

  float dux = 0.5 * (uR - uL);
  float duy = 0.5 * (uU - uD);

  vec2 G = texture2D(uDrift, vUV).rg;
  G = (G - 0.5) * 2.0;

  float adv = G.x * dux + G.y * duy;

  float w = basinWeight(vUV, uBasinCenter, uBasinRadius);
  float attract = -uLambda * w * fastTanh(uC - uUstar);

  float rhs = -uGamma * uC
            + uKappa * lap
            + uAlphaG * adv
            + attract
            + uRho * sin(uOmega * uTime);

  float dt = max(uDT, 0.0);
  float eta = hash13(vec3(gl_FragCoord.xy, uFrame)) * 2.0 - 1.0;
  float uNext = clamp(uC + dt * rhs + uSigmaTotal * sqrt(dt) * eta,
                      -1.0, 1.0);

  gl_FragColor = vec4(0.5 + 0.5 * uNext, 0.0, 0.0, 1.0);
}
</script>

<!-- Drift shader -->
<script id="fs-drift" type="x-shader/x-fragment">
precision highp float;
precision mediump sampler2D;

varying highp vec2 vUV;

uniform sampler2D uField;
uniform sampler2D uDrift;

uniform float uDT;
uniform float uBeta;
uniform float uEta;
uniform float uChi;
uniform float uDelta;

uniform vec2 uBehavior;
uniform vec2 uContext;
uniform vec2 uTexel;

float fetchU(vec2 uv){
  uv = clamp(uv, 0.001, 0.999);
  float v = texture2D(uField, uv).r;
  return (v - 0.5) * 2.0;
}

void main(){
  vec2 G = (texture2D(uDrift, vUV).rg - 0.5) * 2.0;

  float uC = fetchU(vUV);
  float uL = fetchU(vUV + vec2(-uTexel.x, 0.0));
  float uR = fetchU(vUV + vec2( uTexel.x, 0.0));
  float uD = fetchU(vUV + vec2(0.0, -uTexel.y));
  float uU = fetchU(vUV + vec2(0.0,  uTexel.y));

  vec2 gradU = 0.5 * vec2(uR - uL, uU - uD);
  vec2 fieldBias = uC * gradU;

  vec2 dG = -uBeta * G
          + uEta * fieldBias
          + uChi * uBehavior
          + uDelta * uContext;

  vec2 Gnext = G + uDT * dG;

  float L = length(Gnext);
  if (L > 1.0) {
    Gnext = normalize(Gnext);
  }

  vec2 outG = 0.5 + 0.5 * Gnext;
  gl_FragColor = vec4(outG, 0.0, 1.0);
}
</script>

<!-- Render shader -->
<script id="fs-render" type="x-shader/x-fragment">
precision highp float;
precision mediump sampler2D;

varying highp vec2 vUV;
uniform sampler2D uField;

void main(){
  float v = texture2D(uField, vUV).r;
  v = max(0.0, min(1.0, v));
  gl_FragColor = vec4(vec3(v), 1.0);
}
</script>

<!-- JS -->
<script src="evf_research.js"></script>

<script>
document.addEventListener('touchmove', function(e){
  if (!e.target.closest('#sidebar')) e.preventDefault();
}, {passive:false});
document.addEventListener('touchstart',function(e){
  if (e.touches.length>1) e.preventDefault();
},{passive:false});
</script>

</body>
</html>
