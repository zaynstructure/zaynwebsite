<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>EVF-2.3 · Mobile CPU Sandbox</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  html, body {
    margin:0; padding:0;
    background:#111; color:#eee;
    font-family:system-ui, sans-serif;
    height:100%; overflow:hidden;
  }

  #container {
    display:flex;
    flex-direction:row;
    height:100%;
  }

  #canvas-wrap {
    flex:1 1 auto;
    background:#000;
    min-height:250px;
  }

  #fieldCanvas {
    width:100%;
    height:100%;
    image-rendering: pixelated;
    display:block;
    background:#000;
  }

  #sidebar {
    flex:0 0 280px;
    padding:10px;
    background:#181818;
    overflow-y:auto;
    font-size:12px;
  }

  .section {
    margin-bottom:10px;
    border-bottom:1px solid #333;
    padding-bottom:6px;
  }

  .section-title {
    text-transform:uppercase;
    font-size:11px;
    color:#aaa;
    margin-bottom:4px;
  }

  label {
    display:block;
    margin-top:4px;
    font-size:11px;
  }

  input[type=range] { width:100%; }

  button {
    font-size:11px;
    padding:3px 6px;
    margin-right:5px;
  }

  #status, #cs-label {
    margin-top:6px;
    font-size:11px;
  }

  /* Mobile layout */
  @media (max-width: 700px) {
    #container {
      flex-direction:column;
    }
    #sidebar {
      width:100%;
      max-height:40vh;
    }
    #canvas-wrap {
      min-height:300px;
    }
  }
</style>
</head>
<body>

<div id="container">
  <div id="canvas-wrap">
    <canvas id="fieldCanvas"></canvas>
  </div>

  <div id="sidebar">
    <div class="section">
      <button id="btn-reset">Reset</button>
      <button id="btn-pause">Pause</button>
      <div id="status">dt ≈ …</div>
      <div id="cs-label">Cₛ ≈ …</div>
    </div>

    <div class="section">
      <div class="section-title">Field Parameters</div>
      <label>Diffusion κ
        <input id="p-kappa" type="range" min="0" max="1" step="0.01" value="0.25">
      </label>
      <label>Damping γ
        <input id="p-gamma" type="range" min="0.1" max="3" step="0.01" value="0.8">
      </label>
      <label>Attractor λ
        <input id="p-lambda" type="range" min="0" max="2" step="0.01" value="0.7">
      </label>
      <label>Baseline u*
        <input id="p-ustar" type="range" min="-1" max="1" step="0.01" value="0">
      </label>
      <label>Basin Radius R
        <input id="p-basinR" type="range" min="0.03" max="0.4" step="0.005" value="0.12">
      </label>
      <label>Rhythm ρ
        <input id="p-rho" type="range" min="0" max="1" step="0.01" value="0.3">
      </label>
      <label>ω
        <input id="p-omega" type="range" min="0.1" max="3" step="0.01" value="0.8">
      </label>
    </div>

    <div class="section">
      <div class="section-title">Noise</div>
      <label>σ₀
        <input id="p-sigma0" type="range" min="0" max="0.5" step="0.01" value="0.05">
      </label>
      <label>σₑ
        <input id="p-sigmaE" type="range" min="0" max="1" step="0.01" value="0.15">
      </label>
    </div>
  </div>
</div>

<script>
(function(){

  const canvas = document.getElementById("fieldCanvas");
  const ctx = canvas.getContext("2d");

  const W = 128, H = 128;
  canvas.width = W;
  canvas.height = H;

  let field = new Float32Array(W*H);
  let fieldNext = new Float32Array(W*H);

  function initField(){
    for(let i=0;i<W*H;i++){
      field[i] = (Math.random()*0.2 - 0.1);
    }
  }

  initField();

  let paused = false;
  document.getElementById("btn-pause").onclick =()=> {
    paused = !paused;
  };
  document.getElementById("btn-reset").onclick =()=> {
    initField();
  };

  // Parameters
  const pKappa  = document.getElementById("p-kappa");
  const pGamma  = document.getElementById("p-gamma");
  const pLambda = document.getElementById("p-lambda");
  const pUstar  = document.getElementById("p-ustar");
  const pR      = document.getElementById("p-basinR");
  const pRho    = document.getElementById("p-rho");
  const pOmega  = document.getElementById("p-omega");

  const pSigma0 = document.getElementById("p-sigma0");
  const pSigmaE = document.getElementById("p-sigmaE");

  // Fixed dt for mobile
  const dt = 0.01;

  function update(){
    const gamma  = +pGamma.value;
    const kappa  = +pKappa.value;
    const lambda = +pLambda.value;
    const ustar  = +pUstar.value;
    const R      = +pR.value;
    const rho    = +pRho.value;
    const omega  = +pOmega.value;

    const sigma0 = +pSigma0.value;
    const sigmaE = +pSigmaE.value;

    const time = performance.now()*0.001;

    for(let y=0;y<H;y++){
      const yU = (y-1+H)%H;
      const yD = (y+1)%H;
      for(let x=0;x<W;x++){
        const xL = (x-1+W)%W;
        const xR = (x+1)%W;

        const i = y*W + x;
        const u = field[i];

        const uL = field[y*W + xL];
        const uRr= field[y*W + xR];
        const uU = field[yU*W + x];
        const uD = field[yD*W + x];

        const lap = (uL + uRr + uU + uD - 4*u);

        const dx = x/W - 0.5;
        const dy = y/H - 0.5;
        const r2 = dx*dx + dy*dy;
        const w = Math.exp(-r2/(2*R*R));

        const attract = -lambda * w * Math.tanh(u - ustar);

        const damp = -gamma * u;
        const rhythm = rho * Math.sin(omega * time);

        const noise = (sigma0 + sigmaE) * (Math.random()*2 - 1);

        const du = damp + kappa*lap + attract + rhythm + noise;

        fieldNext[i] = Math.max(-1, Math.min(1, u + dt*du));
      }
    }

    let tmp = field;
    field = fieldNext;
    fieldNext = tmp;
  }

  function draw(){
    const image = ctx.createImageData(W,H);
    const data = image.data;

    for(let i=0;i<W*H;i++){
      const v = (field[i]*0.5 + 0.5)*255;
      const idx = i*4;
      data[idx] = v;
      data[idx+1] = v;
      data[idx+2] = v;
      data[idx+3] = 255;
    }

    ctx.putImageData(image,0,0);
  }

  function loop(){
    requestAnimationFrame(loop);

    if(!paused){
      update();
      draw();
    }

    document.getElementById("status").textContent =
      "dt ≈ 0.01";
  }

  loop();

})();
</script>

</body>
</html>
